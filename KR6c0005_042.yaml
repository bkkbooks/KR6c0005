body:
  text: 龍樹菩薩造後秦龜茲國鳩摩羅什奉詔譯經爾時慧命須菩提白佛言世尊我不覺不得是菩薩行般若波羅蜜當為誰説般若波羅蜜世尊我不得一切諸法集散若我為菩薩作字言菩薩或當有悔世尊是字不住亦不不住何以故是字無所有故以是故是字不住亦不不住世尊我不得色集散乃至識集散若不可得云何當作名字世尊以是因緣故是字不住亦不不住何以故是名字無所有故世尊我亦不得眼集散乃至意集散若不可得云何當作名字言是菩薩世尊是眼名字乃至意名字不住亦不不住何以故是名字無所有故以是故是字不住亦不不住世尊我不得色集散乃至法集散若不可得云何當作名字言是菩薩世尊是色字乃至法字不住亦不不住何以故是字無所有故以是故是字不住亦不不住眼識乃至意識眼觸乃至意觸眼觸因緣生受乃至意觸因緣生受亦如是世尊我不得無明集散乃至不得老死集散世尊我不得無明盡集散乃至不得老死盡集散世尊我不得淫怒癡集散諸邪見集散皆亦如是世尊我不得六波羅蜜集散四念處集散乃至八聖道分集散空無相無作集散四禪四無量心四無色定集散念佛念法念僧念戒念捨念天念善念入出息念身念死集散我亦不得佛十力乃至十八不共法集散世尊我若不得六波羅蜜乃至十八不共法集散云何當作字言是菩薩世尊是字不住亦不不住何以故是字無所有故以是故是字不住亦不不住世尊我不得如夢五陰集散我不得如響如影如焰如化五陰集散亦如上説世尊我不得離集散我不得寂滅不生不滅不示不垢不淨集散世尊我不得如法性實際法相法位集散亦如上説我不得諸善不善法集散我不得有為無為法有漏無漏法集散過去未來現在法集散不過去不未來不現在法集散何等是不過去不未來不現在所謂無為法世尊我亦不得無為法集散世尊我亦不得佛集散世尊我亦不得十方如恆河沙等世界諸佛及菩薩聲聞僧集散世尊我若不得諸佛集散云何當教菩薩摩訶薩般若波羅蜜世尊是菩薩字不住亦不不住何以故是字無所有故以是故是字不住亦不不住世尊我亦不得是諸法實相集散云何當與菩薩作字言是菩薩世尊是諸法實相名字不住亦不不住何以故是名字無所有故以是故是名字不住亦不不住論問曰先品中已説不見菩薩菩薩字般若波羅蜜一切諸法不內不外不中間等今何以重説答曰有四種愛欲愛有愛非有愛法愛欲愛易見其過不淨等有愛無不淨等小難遣非有愛破有似智慧故難遣法愛者愛諸善法利益道者法愛中過患難見故重説譬如小草加功少易除大樹功重難除復次上法與此法有同有異彼聞説菩薩字不見此中説菩薩字不覺不得以不覺不得故不見非是智慧力少故不見問曰未行般若波羅蜜時為有菩薩耶今何以故言不見菩薩行般若波羅蜜答曰從無始已來衆生不可得非行般若波羅蜜故不可得但以虛誑顛倒凡夫人隨是假名故謂為有今行般若波羅蜜滅虛誑顛倒了知其無非本有今無本有今無則墮斷滅復次須菩提心悔畏破妄語戒所以者何佛法中一切諸法決定無我而我説言有菩薩為説般若波羅蜜則墮妄語罪是故心悔復次有心悔因緣一切法以不可得空故皆空所以者何無集無散故譬如眼色因緣生眼識三事和合故生眼觸眼觸因緣中即生受想思等心數法是中邪憶念故生諸煩惱罪業正憶念故生諸善法善惡業受六道果報從是身邊復種善惡業如是展轉無窮是名為集餘情亦如是散者是眼識等諸法念念滅故諸因緣離故是眼識等法生時無來處非如田上穀運致聚集若滅時無去處非如散穀與民是名略説諸法集散相生時無所從來散時無所去是諸法皆如幻化但誑惑於眼問曰若爾有集散相須菩提何以言不覺不得答曰無來處故集不可得無去處故散不可得復次生無故集不可得滅無故散不可得畢竟空故集不可得業因緣不失故散不可得復次觀世間滅諦故集不可得觀世間集諦故散不可得如是等義當知集散不可得云何當作菩薩字若強為名是名亦無住亦無不住問曰是名字何以故不住答曰名字在法中住法空故名字無住處如車輪輞輻轂等和合故有車名若散是和合則失車名是車名非輪等中住亦不離輪等中住車名字一異中求皆不得失車名字故名字無住處因緣散時尚無何況因緣滅衆生亦如是色等五衆和合故有衆生字若五衆離散名字無住處五衆離散時尚無何況無五衆問曰若散時名字不可得和合未散時則有名字何以言不可得答曰是菩薩名字一五衆則有五一不作五五不作一若五作一如五匹物不得為一匹用若一作五如一匹物不得為五匹用以是故一菩薩字不得五衆中住非不住者若名字因緣和合無則世俗語言衆事都滅世諦無故第一義諦亦無二諦無故諸法錯亂復次若因緣中有名字者如説火則燒口説有則塞口若名字不在法中者説火不應生火想求火亦可得水從久遠已來共傳名字故因名則識事以是故説名字義非住非不住復次是中須菩提自説因緣無所有故是名字非住非不住如菩薩名字五衆十二入十八界等諸法亦如是問曰如上來説五衆諸法集散不可得今何以復説五衆答曰上直説五衆今説五衆如夢如幻復次有人謂凡夫人五衆虛誑不實如夢聖人五衆非是虛誑以是故須菩提説如夢如幻同皆不住問曰十譬喻中何以但説五事答曰若説十事無在但以隨衆生心説五喻事辨故不盡説或以五衆故説五喻餘法亦如是離有二種一者身離二者心離身離者捨家恩愛世事等間居靜處心離者於諸結使悉皆遠離復有二種離一者諸法離名字二者諸法各各離自相此中説後二種離所以者何此中破名字故餘處自相離小乘法中多説前二離寂滅亦有二種一者淳善相寂滅惡事二者如涅槃寂滅相觀世間諸法亦如是此中但説後寂滅不生亦有二種一者未來無為法名不生二者一切法實無生相生不可得故此中但説後不生不滅有三種智緣滅非智緣滅無常滅此中説無常滅與此相違故名不滅不示者一切諸觀滅語言道斷故無法可示是法如是相若有若無若常若無常等不垢不淨如法性實際法相法位義如先説問曰五衆法有集散與此相違故言不集不散如法性實際等無相違故云何言不集不散答曰行者得如法性等故名為集失故名為散如虛空雖無集無散鑿戶牖名為集塞故名為散善不善乃至十方如恆河沙等諸佛義如先説是諸佛法及佛名字無所依止故皆空不住非不住經世尊諸法因緣和合假名施設所謂菩薩是名字於五受陰中不可説十二入十八界乃至十八不共法中不可説於和合法中亦不可説世尊譬如夢於諸法中不可説響影焰化於諸法中亦不可説譬如名虛空亦無法中可説世尊如地水火風名亦無法中可説戒三昧智慧解脫解脫知見名亦無法中可説如須陀洹名字乃至阿羅漢辟支佛名字亦無法中可説如佛名法名亦無法中可説所謂若善若不善若常若無常若苦若樂若我若無我若寂滅若離若有若無世尊我以是義故心悔一切諸法集散相不可得若為菩薩作字言是菩薩世尊是字不住亦不不住何以故是字無所有故以是故是字不住亦不不住若菩薩摩訶薩聞作是説般若波羅蜜如是相如是義心不沒不悔不驚不畏不怖當知是菩薩必住阿鞞跋致性中住不住法故論釋曰上來非住非不住門破菩薩名字及諸法今以異門破菩薩名字無法可説為菩薩何以故菩薩非是五衆五衆非是菩薩五衆中無菩薩菩薩中無五衆五衆不屬菩薩菩薩不屬五衆離五衆無菩薩離菩薩無五衆如是菩薩名字不可得當知是空乃至十八不共法亦如是譬如夢中有所見皆是虛妄不可説此夢中無有定法相所謂五衆十二入十八界但有誑心餘影響焰化亦如是但誑耳目如虛空一切法中不可説無相故虛空與色相違故不得説名為色色盡處亦非虛空更無別法故若謂入出為虛空相是事不然是身業非虛空相若無相則無法以是故虛空但有名字菩薩名字亦如是問曰如夢虛空等可但有名字云何地水火風實法亦但有名字答曰無智人謂地等諸物以為實聖人慧眼觀之皆是虛誑譬如小兒見鏡中像以為實歡喜欲取謂為真實大人觀之但誑惑人眼諸凡夫人見微塵和合成地謂為實地餘有天眼者散此地但見微塵慧眼分別破散此地都不可得復次初品論中種種破身相如身破地亦破復次若地是實云何一切火觀時皆是火若以禪定觀為實佛説一切法空為虛妄但是事不然水火風亦如是如四大為身本猶尚爾何況身所作持戒等諸業而不空如戒等麁業尚空何況禪定智慧解脫解脫知見等而不空若戒等五衆空者何況是因緣得諸聖道果而不空若聖道果空者何況須陀洹人乃至佛而不空以是故菩薩名字雖善法乃至有無法中出不名為善乃至不名為有無集散不可得故須菩提知空相如是云何説名菩薩為説般若波羅蜜若菩薩聞是不恐不畏則是阿鞞跋致性中住以如不住法住故阿鞞跋致性者是菩薩未得無生法忍未從諸佛授記但福德智慧力故能信樂諸法畢竟空是名阿鞞跋致性中住得阿鞞跋致氣分故如小兒在貴性中生雖未成事以姓貴故便貴經復次世尊菩薩摩訶薩欲行般若波羅蜜色中不應住受想行識中不應住眼耳鼻舌身意中不應住色聲香味觸法中不應住眼識乃至意識中不應住眼觸乃至意觸中不應住眼觸因緣生受乃至意觸因緣生受中不應住地種水火風空識種中不應住無明乃至老死中不應住何以故世尊色色相空受想行識識相空世尊色空不名為色離空亦無色色即是空空即是色受想行識空不名為識離空亦無識識即是空空即是識乃至老死老死相空世尊老死空不名為老死離空亦無老死老死即是空空即是老死世尊以是因緣故菩薩摩訶薩欲行般若波羅蜜不應色中住乃至老死中亦不應住復次世尊菩薩摩訶薩欲行般若波羅蜜四念處中不應住何以故四念處四念處相空世尊四念處空不名為四念處離空亦無四念處四念處即是空空即是四念處乃至十八不共法亦如是世尊以是因緣故菩薩摩訶薩欲行般若波羅蜜四念處乃至十八不共法中不應住復次世尊菩薩摩訶薩欲行般若波羅蜜檀波羅蜜中不應住尸羅波羅蜜羼提波羅蜜毗梨耶波羅蜜禪波羅蜜般若波羅蜜中不應住何以故檀波羅蜜檀波羅蜜相空乃至般若波羅蜜般若波羅蜜相空世尊檀波羅蜜空不名為檀波羅蜜離空亦無檀波羅蜜檀波羅蜜即是空空即是檀波羅蜜乃至般若波羅蜜亦如是世尊以是因緣故菩薩摩訶薩欲行般若波羅蜜不應六波羅蜜中住論釋曰上須菩提以謙讓門説般若雖言不説而實為諸菩薩説般若波羅蜜今須菩提以不住門直為菩薩説般若波羅蜜般若波羅蜜有種種名字觀修相應合入習住等是皆名修行般若波羅蜜但種種名字説聞者歡喜復次小有差別行名聽聞誦讀書寫正憶念説思惟籌量分別修習等乃至阿耨多羅三藐三菩提總名為行是行中分別故初者名觀如初始見物日日漸學是名習與般若波羅蜜相可是名合隨順般若波羅蜜名相應通徹般若波羅蜜是名為入分別取相有是事名為念常行不息令與相似是名為學學已巧方便觀知是非得失名為思惟以禪定心共行名為修得是般若波羅蜜道不失是名住與住相違名不住問曰先説諸法空即是不住今何以説諸法中不應住答曰先雖説著法愛心難遣故今更説復次有無相三昧入此三昧於一切法不取相而不入滅定菩薩智慧不可思議雖不取一切法相而能行道如鳥於虛空中無所依而能高飛菩薩亦如是於諸法中不住而能行菩薩道問曰人心得緣便起云何菩薩於一切法不住而不入滅定中答曰此中須菩提自説所謂色色相自空色空為非色亦不離空有色色即是空空即是色是義第二品中已説乃至不應六波羅蜜中住亦如是以空故無所住經復次世尊菩薩摩訶薩欲行般若波羅蜜文字中不應住一字門二字門如是種種字門中不應住何以故諸字諸字相空故亦如上説復次世尊菩薩摩訶薩欲行般若波羅蜜諸神通中不應住何以故諸神通諸神通相空神通空不名為神通離空亦無神通神通即是空空即是神通世尊以是因緣故菩薩摩訶薩欲行般若波羅蜜諸神通中不應住論釋曰有二種菩薩一者習禪定二者學讀坐禪者生神通學讀者知分別文字一字門者一字一語如地名浮二字門者二字一語如水名闍藍三字門者如水名波尸藍如是等種種字門復次菩薩聞一字即入一切諸法實相中如聞阿字即知諸法從本已來無生如是等如聞頭佉一切法中苦相生即時生大悲心如聞阿尼吒知一切法無常相即時入道聖行餘如文字陀羅尼中廣説神通義先已説是二事畢竟空故菩薩不於中住經復次世尊菩薩摩訶薩欲行般若波羅蜜色是無常不應住受想行識是無常不應住何以故無常無常相空世尊無常空不名無常離空亦無無常無常即是空空即是無常世尊以是因緣故菩薩摩訶薩欲行般若波羅蜜色是無常不應住受想行識是無常不應住色是苦不應住受想行識是苦不應住色是無我不應住受想行識是無我不應住色是空不應住受想行識是空不應住色是寂滅不應住受想行識是寂滅不應住色是離不應住受想行識是離不應住亦如上説復次世尊菩薩摩訶薩欲行般若波羅蜜如相中不應住何以故如相如相空世尊如相空不名為如離空亦無如如即是空空即是如世尊菩薩摩訶薩欲行般若波羅蜜法性法相法位實際中不應住何以故實際空世尊實際空不名為實際離空亦無實際實際即是空空即是實際復次世尊菩薩摩訶薩欲行般若波羅蜜一切陀羅尼門中不應住一切三昧門中不應住何以故陀羅尼門陀羅尼門相空三昧門三昧門相空世尊陀羅尼門三昧門空不名為陀羅尼門三昧門離空亦無陀羅尼三昧門陀羅尼三昧門即是空空即是陀羅尼三昧門世尊以是因緣故菩薩摩訶薩欲行般若波羅蜜乃至陀羅尼三昧門中不應住世尊如菩薩摩訶薩欲行般若波羅蜜無方便故以吾我心於色中住是菩薩作色行以吾我心於受想行識中住是菩薩作識行若菩薩作行者不受般若波羅蜜亦不具足般若波羅蜜不具足般若波羅蜜故不能得成就薩婆若世尊如是菩薩摩訶薩欲行般若波羅蜜無方便故以吾我心於十二入乃至陀羅尼三昧門中住是菩薩作十二入乃至作陀羅尼三昧門行若菩薩作行者不受般若波羅蜜亦不具足般若波羅蜜不具足般若波羅蜜故不能得成就薩婆若何以故色是不受受想行識是不受色不受則非色性空故受想行識不受則非識性空故十二入是不受乃至陀羅尼三昧門是不受十二入不受則非十二入乃至陀羅尼三昧門不受則非陀羅尼三昧門性空故般若波羅蜜亦不受般若波羅蜜不受則非般若波羅蜜性空故如是菩薩摩訶薩欲行般若波羅蜜應觀諸法性空如是觀心無行處是名菩薩摩訶薩不受三昧廣大之用不與聲聞辟支佛共是薩婆若慧亦不受內空故外空內外空空空大空第一義空有為空無為空畢竟空無始空散空性空自相空諸法空不可得空無法空有法空無法有法空故何以故是薩婆若不可以相行得相行有垢故何等是垢相色相乃至諸陀羅尼三昧門相是名垢相是相若受若修可得薩婆若者論釋曰無常等聖行及如法性實際陀羅尼三昧門先已説問曰垢法中不應住以罪故善無記法中何故不應住答曰是雖非罪而生罪因緣如佛此中説有菩薩以吾我心行般若波羅蜜住色中著色為生色故作諸業受想行識亦如是為起五衆故行是為不取般若波羅蜜是人雖言我行般若波羅蜜是為世間行不具足般若波羅蜜故不能至一切智乃至陀羅尼三昧門亦如是此中須菩提自説不住因緣所謂色是不受若色不受則非色性常空故問曰是色無常苦空等過罪故不受譬如熱金丸雖有金可貪但以熱故知不可取如是者有何咎而強破五衆法答曰有二種著一者欲著二者見著有人觀是無常苦等破欲著得解脫或有人雖觀無常等猶著法生見為是人故分別色相空如是則離見著乃至陀羅尼三昧門亦如是問曰聲聞辟支佛一切法不受故漏盡此中云何説不受三昧不與二乘共答曰彼雖有不受三昧無有廣大之用不利不深亦不堅固復次聲聞辟支佛漏盡時得諸法不受菩薩久來知一切法不受皆如無餘涅槃畢竟空是故説不與二乘共復次二乘有習氣有礙有障故雖有無受三昧不清淨如摩訶迦葉聞菩薩伎樂於坐處不能自安諸菩薩問言汝頭陀第一何故欲起似舞迦葉答言我於人天五欲中永離不動此是大菩薩福德業因緣變化力我未能忍如須彌山王四面風起皆能堪忍若隨嵐風至不能自安聲聞辟支佛習氣於菩薩為煩惱復次此無受三昧惟佛遍知菩薩求佛道故雖不能遍而勝於二乘以是故説不與二乘共以人貴重是不受三昧而生著心是故須菩提説不但是三昧不受色乃至一切種智皆不受所以者何須菩提自説因緣所謂十八空故不受問曰何以故用是十八空觀諸法皆空答曰此中須菩提自説因緣取相著故生諸結使相者色乃至陀羅尼門諸三昧門相皆是煩惱根本若佛法中乃至無有法微相可取者經先尼梵志於一切智中終不生信云何為信信般若波羅蜜分別解知稱量思惟不以相法不以無相法如是先尼梵志不取相住信行中用性空智入諸法相不受色不受受想行識何以故諸法自相空故不可得受是先尼梵志非內觀得故見是智慧非外觀得故見是智慧非內非外觀得故見是智慧亦不無智慧觀得故見是智慧何以故梵志不見是法知者知法知處故此梵志非內色中見是智慧非內受想行識中見是智慧非外色中見是智慧非外受想行識中見是智慧非內外色中見是智慧非內外受想行識中見是智慧亦不離色受想行識中見是智慧內外空故先尼梵志此中心得信解於一切智以是故梵志信諸法實相一切法不可得故如是信解已無法可受諸法無相無憶念故是梵志於諸法亦無所得若取若捨取捨不可得故是梵志智慧亦不念諸法相不念故世尊是名菩薩摩訶薩般若波羅蜜此彼岸不度故是菩薩色受想行識不受一切法不受故乃至諸陀羅尼三昧門亦不受一切法不受故是菩薩於是中亦不取涅槃未具足四念處乃至八聖道分未具足十力乃至十八不共法何以故是四念處非四念處乃至十八不共法非十八不共法是諸法非法亦不非法是名菩薩摩訶薩般若波羅蜜色不受乃至十八不共法不受論問曰此中何因緣説先尼梵志答曰此經種種因緣説法空乃至無微相可取人心疑怪不信是理難見以畢竟無相故以是故須菩提引證小乘中尚有法空何況行大乘法者而不信法空復次如刪若婆婆羅門善知一切智人相見菩薩食乳糜知今日當成佛先尼是其舅也耆年智德有大名聞出家廣讀一切經書修心坐禪學道時時欲求智慧故往詣論議堂諸梵志言六師皆自稱一切智不蘭迦葉有大名聞是大衆師其弟子死若小若大皆不説其生處餘五師弟子死若小若大皆説其生處佛亦是大師有大名聞其弟子死小者説其生處大者不説其生處先尼聞已異時詣佛所問訊已一面坐問佛言佛聽當問佛言恣汝所問先尼言昔我一時曾到論堂與諸人論議如昔所聞具向佛説是時我作是念佛法説弟子小者更生大者不生何者為定佛告先尼我法甚深微妙難解汝等長夜著諸異見異欲異法汝於我法不能自見先尼梵志白佛言我心敬佛願加愍念為説妙法令我於坐得眼無令空起佛問梵志於汝意云何汝見是色如去不答言不也受想行識如去不答言不也色中如去不答言不也受想行識中如去不答言不也離色如去不答言不也離受想行識如去不答言不也汝更見無色無受想行識如去者不答曰不也若汝種種門不見如去者應生疑言佛法何者為定答曰不應佛告先尼若我弟子是法中不了了知者説有後生本來有我慢等殘故若我弟子了了解知是義者不説其生處本來我慢等無殘故先尼聞是已即時得道得道已從坐起白佛言願得出家為道即時鬢髮自墮便成沙門不久得阿羅漢從佛得眼不虛故是經論議先尼信者信佛能令我得道是名初信然後聞佛破吾我從本已來常自無我無我故諸法無所屬如幻如夢虛誑不實不可得取得是信力已入諸法實相不受色是如去乃至識是如去問曰梵志何以答佛皆言不也答曰梵志本總相為我佛今一一別問以是故答佛言不也復次梵志聞人二種説我或有説五衆即是我或有説離五衆別有我若五衆即是我則無別我所以者何我是一衆是五一不作五五不作一復次五衆無常生滅相五衆是我亦應生滅若生滅者則失罪福是五衆從因緣和合生不自在我若爾者何用我為不自在故如是等過罪故不得説言色如去受想行識如去離五衆亦不應有我無相故若知見受等是皆五衆相非是我相智者云何説離五衆而有我以是故言不也若有言別更有我無五衆是亦不然皆是顛倒妄見分別如是種種因緣知無我我即是如去諸法亦爾皆同如去以無主故法無所屬復次梵志推求得道智慧於四處求之皆無定相所謂觀自身五衆名為內外觀他身名為外彼此名為內外是三種智慧不得道無智慧亦不得道復次內者內六入外者外六入復次內名能觀智慧外名所觀處是先尼知諸觀皆有過罪何以故內以智慧力故謂外諸法是常無常有無等非外法有定相若有定相則無智用又此智慧從外法因緣生外法相不定故智慧亦不定如稱為物故物為稱故二事相待若離物無稱離稱無物無量教智名得道方便得名得聖道果復次略説實智慧義所謂不見內五衆中不見外五衆中亦不見內外五衆中亦不見離五衆中見是智慧為實以無常智慧觀五衆無常是智慧從因緣和合故有不實著觀者邪見不著者得道若無常相是實者何故著而不得道以是故一切內外不見定智慧若離是無常等觀得道者一切凡人亦應得道以是故説離是智慧亦無所得爾時梵志以是智慧於一切法中心得遠離於智慧亦復遠離一切我見等取相邪見一切皆滅亦不從無智得爾時梵志歡喜觀無量法性相佛真為大師不捨者諸法中皆有助道力故不受者諸法實相畢竟空無所得故不受復次諸結使煩惱顛倒虛妄故無所捨但知諸法如實相無相無憶念故是名菩薩不受不捨波羅蜜名為般若波羅蜜此彼岸不度故世間即是涅槃相涅槃相即是世間相一相所謂無相若如是知應當滅以未具足諸功德故不滅大慈悲本願力故不滅雖求佛道於此法中亦無好醜相及受捨相以是故非法亦非非法是名菩薩般若波羅蜜一切相不受
