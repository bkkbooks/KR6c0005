body:
  text: 龍樹菩薩造後秦龜茲國三藏鳩摩羅什奉詔譯問曰已知尸羅相云何為尸羅波羅蜜答曰有人言菩薩持戒寧自失身不毀小戒是為尸羅波羅蜜如上蘇陀蘇摩王經中説不惜身命以全禁戒如菩薩本身曾作大力毒龍若衆生在前身力弱者眼視便死身力強者氣往而死是龍受一日戒出家求靜入林樹間思惟坐久疲懈而睡龍法睡時形狀如蛇身有文章七寶雜色獵者見之驚喜言曰以此希有難得之皮獻上國王以為服飾不亦宜乎便以杖按其頭以刀剝其皮龍自念言我力如意傾覆此國其如反掌此人小物豈能困我我今以持戒故不計此身當從佛語於是自忍眠目不視閉氣不息憐愍此人為持戒故一心受剝不生悔意既以失皮赤肉在地時日大熱宛轉土中欲趣大水見諸小蟲來食其身為持戒故不復敢動自思惟言今我此身以施諸蟲為佛道故今以肉施以充其身後成佛時當以法施以益其心如是誓已身乾命絶即生第二忉利天上爾時毒龍釋迦文佛是是時獵者提婆達等六師是也諸小蟲輩釋迦文佛初轉法輪八萬諸天得道者是菩薩護戒不惜身命決定不悔其事如是是名尸羅波羅蜜復次菩薩持戒為佛道故作大要誓必度衆生不求今世後世之樂不為名聞虛譽法故亦不自為早求涅槃但為衆生沒在長流恩愛所欺愚惑所誤我當度之令到彼岸一心持戒為生善處生善處故見善人見善人故生智慧生智慧故得行六波羅蜜得行六波羅蜜故得佛道如是持戒名為尸羅波羅蜜復次菩薩持戒心樂善清淨不為畏惡道亦不為生天但求善淨以戒熏心令心樂善是為尸羅波羅蜜復次菩薩以大悲心持戒得至佛道是名尸羅波羅蜜復次菩薩持戒能生六波羅蜜是則名為尸羅波羅蜜云何持戒能生戒因五戒得沙彌戒因沙彌戒得律儀戒因律儀戒得禪定戒因禪定戒得無漏戒是為戒生戒云何持戒能生於檀檀有三種一者財施二者法施三者無畏施持戒自撿不侵一切衆生財物是名財施衆生見者慕其所行又為説法令其開悟又自思惟我當堅持淨戒與一切衆生作供養福田令諸衆生得無量福如是種種名為法施一切衆生皆畏於死持戒不害是則無畏施復次菩薩自念我當持戒以此戒報為諸衆生作轉輪聖王或作閻浮提王若作天王令諸衆生滿足於財無所乏短然後坐佛樹下降伏魔王破諸魔軍成無上道為諸衆生説清淨法令無量衆生度老病死海是為持戒因緣生檀波羅蜜云何持戒生忍辱持戒之人心自念言我今持戒為持心故若持戒無忍當墮地獄雖不破戒以無忍故不免惡道何可縱忿不自制心但以心故入三惡趣是故應當好自勉強勤修忍辱復次行者欲令戒德堅強當修忍辱所以者何忍為大力能牢固戒令不動搖復自思惟我今出家形與俗別豈可縱心如世人法宜自勉勵以忍調心以身口忍心亦得忍若心不忍身口亦爾是故行者當令身口心忍絶諸忿恨復次是戒略説則有八萬廣説則無量我當云何能具持此無量戒法唯當忍辱衆戒自得譬如有人得罪於王王以罪人載之刀車六邊利刃間不容間奔逸馳走行不擇路若能持身不為刀傷是則殺而不死持戒之人亦復如是戒為利刀忍為持身若忍心不固戒亦傷人又復譬如老人夜行無杖則蹶忍為戒杖扶人至道福樂因緣不能動搖如是種種名為持戒生羼提波羅蜜云何持戒而生精進持戒之人除去放逸自力勤修習無上法捨世間樂入於善道志求涅槃以度一切大心不懈以求佛為本是為持戒能生精進復次持戒之人疲厭世苦老病死患心生精進必求自脫亦以度人譬如野干在林樹間依隨師子及諸虎豹求其殘肉以自存活有時空乏夜半踰城深入人舍求肉不得屏處睡息不覺夜竟惶怖無計走則慮不自免住則懼畏死痛便自定心詐死在地衆人來見有一人言我須野干耳即便截取野干自念截耳雖痛但令身在次有一人言我須野干尾便復截去野干復念截尾雖痛猶是小事次有一人言我須野干牙野干心念取者轉多儻取我頭則無活路即從地起奮其智力絶踊間關徑得自濟行者之心求脫苦難亦復如是若老至時猶故自寬不能殷勤決斷精進病亦如是以有差期未能決計死欲至時自知無冀便能自勉果敢殷勤大修精進從死地中畢至涅槃復次持戒之法譬如人射先得平地地平然後心安心安然後挽滿挽滿然後陷深戒為平地定意為弓挽滿為精進箭為智慧賊是無明若能如是展力精進必至大道以度衆生復次持戒之人能以精進自制五情不受五欲若心已去能攝令還是為持戒能護諸根護諸根則生禪定生禪定則生智慧生智慧得至佛道是為持戒生毗梨耶波羅蜜云何持戒生禪人有三業作諸善若身口業善意業自然入善譬如曲草生於麻中不扶自直持戒之力能羸諸結使云何能羸若不持戒瞋恚事來殺心即生若欲事至淫心即成若持戒者雖有微瞋不生殺心雖有淫念淫事不成是為持戒能令諸結使羸諸結使羸禪定易得譬如老病失力死事易得結使羸故禪定易得復次人心未息常求逸樂行者持戒棄捨世福心不放逸是故易得禪定復次持戒之人得生人中次生六欲天上次至色界若破色相生無色界持戒清淨斷諸結使得阿羅漢道大心持戒愍念衆生是為菩薩復次戒為撿麁禪為攝細復次戒攝身口禪止亂心如人上屋非梯不升不得戒梯禪亦不立復次破戒之人結使風強散亂其心其心散亂則禪不可得持戒之人煩惱風軟心不大散禪定易得如是等種種因緣是為持戒生禪波羅蜜云何持戒能生智慧持戒之人觀此戒相從何而有知從衆罪而生若無衆罪則亦無戒戒相如是從因緣有何故生著譬如蓮華出自污泥色雖鮮好出處不淨以是悟心不令生著是為持戒生般若波羅蜜復次持戒之人心自思惟若我以持戒貴而可取破戒賤而可捨者若有此心不應般若以智慧籌量心不著戒無取無捨是為持戒生般若波羅蜜復次不持戒人雖有利智以營世務種種欲求生業之事慧根漸鈍譬如利刀以割泥土遂成鈍器若出家持戒不營世業常觀諸法實相無相先雖鈍根以漸轉利如是等種種因緣名為持戒生般若波羅蜜如是名為尸羅波羅蜜生六波羅蜜復次菩薩持戒不以畏故亦非愚癡非疑非惑亦不自為涅槃故持戒但為一切衆生故為得佛道故為得一切佛法故如是相名為尸羅波羅蜜復次若菩薩於罪不罪不可得故是時名為尸羅波羅蜜問曰若捨惡行善是為持戒云何言罪不罪不可得答曰非謂邪見麁心言不可得也若深入諸法相行空三昧慧眼觀故罪不可得罪無故不罪亦不可得復次衆生不可得故殺罪亦不可得罪不可得故戒亦不可得何以故以有殺罪故則有戒若無殺罪則亦無戒問曰今衆生現有云何言衆生不可得答曰肉眼所見是為非見若以慧眼觀則不得衆生如上檀中説無施者無受者無財物此亦如是復次若有衆生是五衆耶離五衆耶若是五衆五衆有五衆生為一如是者五可為一一可為五譬如市易物直五匹以一匹取之則不可得何以故一不得作五故以是故知五衆不得作一衆生復次五衆生滅無常相衆生法從先世來至後世受罪福於三界若五衆是衆生譬如草木自生自滅如是則無罪縛亦無解脫以是故知非五衆是衆生若離五衆有衆生如先説神常遍中已破復次離五衆則我見心不生若離五衆有衆生是為墮常若墮常者是則無生無死何以故生名先無今有死名已生便滅若衆生常者應遍滿五道中先已常有云何今復來生若不有生則無有死問曰定有衆生何以故言無五衆因緣有衆生法譬如五指因緣拳法生答曰此言非也若五衆因緣有衆生法者除五衆則別有衆生法然不可得眼自見色耳自聞聲鼻嗅香舌知味身知觸意知法空無我法離此六事更無衆生諸外道輩倒見故言眼能見色是為衆生乃至意能知法是為衆生又能憶念能受苦樂是為衆生但作是見不知衆生實譬如一長老大德比丘人謂是阿羅漢多致供養其後病死諸弟子懼失供養故夜盜出之於其臥處安施被枕令如師在其狀如臥人來問疾師在何許諸弟子言汝不見床上被枕耶愚者不審察之謂師病臥大送供養而去如是非一復有智人來而問之諸弟子亦如是答智人言我不問被枕床褥我自求人發被求之竟無人可得除六事相更無我人知者見者亦復如是復次若衆生於五衆因緣有者五衆無常衆生亦應無常何以故因果相似故若衆生無常則不至後世復次若如汝言衆生從本已來常有若爾者衆生應生五衆五衆不應生衆生今五衆因緣生衆生名字無智之人逐名求實以是故衆生實無若無衆生亦無殺罪無殺罪故亦無持戒復次是五衆深入觀之分別知空如夢所見如鏡中像若殺夢中所見及鏡中像無有殺罪殺五陰空相衆生亦復如是復次若人不樂罪貪著無罪是人見破戒罪人則輕慢見持戒善人則愛敬如是持戒則是起罪因緣以是故言於罪不罪不可得故應具足尸羅波羅蜜大智度論釋初品中羼提波羅蜜義第二十四經心不動故應具足羼提波羅蜜論問曰云何名羼提答曰羼提秦言忍辱忍辱有二種生忍法忍菩薩行生忍得無量福德行法忍得無量智慧福德智慧二事具足故得如所願譬如人有目有足隨意能到菩薩若遇惡口罵詈若刀杖所加思惟知罪福業因緣諸法內外畢竟空無我無我所以三法印印諸法故力雖能報不生惡心不起惡口業爾時心數法生名為忍得是忍法故忍智牢固譬如畫彩得膠則堅著有人言善心有二種有麁有細麁名忍辱細名禪定未得禪定心樂能遮衆惡是名忍辱心得禪定樂不為衆惡是名禪定是忍是心數法與心相應隨心行非業非業報隨業行有人言二界繫有人言但欲界繫或不繫色界無外惡可忍故亦有漏亦無漏凡夫聖人俱得故障己心他心不善法故名為善善故或思惟斷或不斷如是等種種阿毗曇廣分別問曰云何名生忍答曰有二種衆生來向菩薩一者恭敬供養二者瞋罵打害爾時菩薩其心能忍不愛敬養衆生不瞋加惡衆生是名生忍問曰云何恭敬供養名之為忍答曰有二種結使一者屬愛結使二者屬恚結使恭敬供養雖不生恚令心愛著是名軟賊是故於此應當自忍不著不愛云何能忍觀其無常是結使生處如佛所説利養瘡深譬如斷皮至肉斷肉至骨斷骨至髓人著利養則破持戒皮斷禪定肉破智慧骨失微妙善心髓如佛初遊迦毗羅婆國與千二百五十比丘俱悉是梵志之身供養火故形容憔悴絶食苦行故膚體瘦黑淨飯王心念言我子侍從雖復心淨清潔並無容貌我當擇取纍重多子孫者家出一人為佛弟子如是思惟已敕下國中簡擇諸釋貴戚子弟應書之身皆令出家是時斛飯王子提婆達多出家學道誦六萬法聚精進修行滿十二年其後為供養利故來至佛所求學神通佛告憍曇汝觀五陰無常可以得道亦得神通而不為説取通之法出求舍利弗目揵連乃至五百阿羅漢皆不為説言汝當觀五陰無常可以得道可以得通不得所求涕泣不樂到阿難所求學神通是時阿難未得他心智敬其兄故如佛所言以授提婆達多受學通法入山不久便得五神通得五神通已自念誰當與我作檀越者如王子阿闍世有大王相欲與為親厚到天上取天食還到鬱旦羅越取自然粳米至閻浮林中取閻浮果與王子阿闍世或時自變其身作象寶馬寶以惑其心或作嬰孩坐其膝上王子抱之嗚唼與唾時時自説己名令太子知之種種變態以動其心王子意惑於奈園中大立精舍四種供養并種種雜供無物不備以給提婆達多日日率諸大臣自為送五百釜羹飯提婆達多大得供養而徒衆鮮少自念我有三十相減佛未幾直以弟子未集若大衆圍繞與佛何異如是思惟已生心破僧得五百弟子舍利弗目犍連説法教化僧還和合爾時提婆達多便生惡心推山壓佛金剛力士以金剛杵而遙擲之碎石迸來傷佛足指華色比丘尼呵之復以拳打尼尼即時眼出而死作三逆罪與惡邪師富蘭那外道等為親厚斷諸善根心無愧悔復以惡毒著指爪中欲因禮佛以中傷佛欲去未到王舍城中地自然破裂火車來迎生入地獄提婆達多身有三十相而不能忍伏其心為供養利故而作大罪生入地獄以是故言利養瘡深破皮至髓應當除却愛供養人心是為菩薩忍心不愛著供養恭敬人復次供養有三種一者先世因緣福德故二者今世功德修戒禪定智慧故為人敬養三者虛妄欺惑內無實德外如清白以誑時人而得供養於此三種供養中心自思惟若先世因緣勤修福德今得供養是為勤身作之而自得耳何為於此而生貢高譬如春種秋穫自以力得何足自憍如是思惟已忍伏其心不著不憍若今世功德故而得供養當自思惟我以智慧若知諸法實相若能斷結以此功德故是人供養於我無事如是思惟已自伏其心不自憍高此實愛樂功德不愛我也譬如罽賓三藏比丘行阿蘭若法至一王寺寺設大會守門人見其衣服麁弊遮門不前如是數數以衣服弊故每不得前便作方便假借好衣而來門家見之聽前不禁既至會坐得種種好食先以與衣衆人問言何以爾也答言我比數來每不得入今以衣故得在此坐得種種好食實是衣故得之故以與衣行者以修行功德持戒智慧故而得供養自念此為功德非為我也如是思惟能自伏心是名為忍若虛妄欺偽而得供養是為自害不可近也當自思惟若我以此虛妄而得供養與惡賊劫盜得食無異是為墮欺妄罪如是於三種供養人中心不愛著亦不自高是名生忍問曰人未得道衣食為急云何方便能得忍心不著不愛給施之人答曰以智慧力觀無常相苦相無我相心常厭患譬如罪人臨當受戮雖復美味在前家室勸喻以憂死故雖飲食肴膳不覺滋味行者亦爾常觀無常相苦相雖得供養心亦不著又如麞鹿為虎搏逐追之不捨雖得好草美水飲食心無染著行者亦爾常為無常虎逐不捨須臾思惟厭患雖得美味亦不染著是故行者於供養人中心得自忍復次若有女人來欲娛樂誑惑菩薩菩薩是時當自伏心忍不令起如釋迦文尼佛在菩提樹下魔王憂愁遣三玉女一名樂見二名悅彼三名渴愛來現其身作種種姿態欲壞菩薩菩薩是時心不傾動目不暫視三女念言人心不同好愛各異或有好少或愛中年或好長好短好黑好白如是衆好各有所愛是時三女各各化作五百美女一一化女作無量變態從林中出譬如黑雲電光暫現或揚眉頓睫嫈嫇細視作衆伎樂種種姿媚來近菩薩欲以態身觸逼菩薩爾時密迹金剛力士瞋目叱之此是何人而汝妖媚敢來觸嬈爾時密迹説偈呵之汝不知天命失好而黃髯大海水清美今日盡苦醎汝不知日減婆藪諸天墮火本為天口而今一切噉汝不知此事敢輕此聖人是時衆女逡巡小退語菩薩言今此衆女端嚴無比可自娛意端坐何為菩薩言汝等不淨臭穢可惡去勿妄談菩薩是時即説偈言是身為穢藪不淨物腐積是實為行廁何足以樂意女聞此偈自念此人不知我等清淨天身而説此偈即自變身還復本形光曜昱爍照林樹間作天伎樂語菩薩言我身如是有何可呵菩薩答言時至自知問曰此言何謂以偈答言諸天園林中七寶蓮華池天人相娛樂失時汝自知是時見無常天人樂皆苦汝當厭欲樂愛樂正真道女聞偈已心念此人大智無量天樂清淨猶知其惡不可當也即時滅去菩薩如是觀淫欲樂能自制心忍不傾動復次菩薩觀欲種種不淨於諸衰中女衰最重刀火雷電霹靂怨家毒蛇之屬猶可暫近女人慳妬瞋諂妖穢鬪諍貪嫉不可親近何以故女子小人心淺智薄唯欲是視不觀富貴智德名聞專行欲惡破人善根桎梏枷鎖閉繫囹圄雖曰難解是猶易開女鎖繫人染固根深無智沒之難可得脫衆病之中女病最重如佛偈言寧以赤鐵宛轉眼中不以散心邪視女色含笑作姿憍慢羞恥回面攝眼美言妬瞋行步妖穢以惑於人淫羅彌網人皆沒身坐臥行立回眄巧媚薄智愚人為之心醉執劍向敵是猶可勝女賊害人是不可禁蚖蛇含毒猶可手捉女情惑人是不可觸有智之人所應不視若欲觀之當如母姊諦視觀之不淨填積淫火不除為之燒滅復次女人相者若得敬待則令夫心高若敬待情捨則令夫心怖女人如是恆以煩惱憂怖與人云何可近親好乖離女人之罪巧察人要女人之智大火燒人是猶可近清風無形是亦可捉蚖蛇含毒猶亦可觸女人之心不可得實何以故女人之相不觀富貴端政名聞智德族姓技藝辨言親厚愛重都不在心唯欲是視譬如蛟龍不擇好醜唯欲殺人又復女人不瞻視憂苦憔悴給養敬待憍奢叵制復次若在善人之中則自畜心高無智人中視之如怨富貴人中追之敬愛貧賤人中視之如狗常隨欲心不隨功德如説國王有女名曰拘牟頭有捕魚師名述婆伽隨道而行遙見王女在高樓上窗中見面想像染著心不暫捨彌歷日月不能飲食母問其故以情答母我見王女心不能忘母諭兒言汝是小人王女尊貴不可得也兒言我心願樂不能暫忘若不如意不能活也母為子故入王宮中常送肥魚美肉以遺王女而不取價王女怪而問之欲求何願母白王女願却左右當以情告我唯有一子敬慕王女情結成病命不云遠願垂愍念賜其生命王女言汝去月十五日於某甲天祠中住天像後母還語子汝願已得告之如上沐浴新衣在天像後住王女至時白其父王我有不吉須至天祠以求吉福王言大善即嚴車五百乘出至天祠既到敕諸從者齊門而止獨入天祠天神思惟此不應爾王為世主不可令此小人毀辱王女即厭此人令睡不覺王女既入見其睡重推之不悟即以瓔珞直十萬兩金遺之而去去後此人得覺見有瓔珞又問衆人知王女來情願不遂憂恨懊惱淫火內發自燒而死以是證故知女人之心不擇貴賤唯欲是從復次昔有國王女逐旃陀羅共為不淨又有仙人女隨逐師子如是等種種女人之心無所選擇以是種種因緣於女人中除去情欲忍不愛著云何瞋惱人中而得忍辱當自思惟一切衆生有罪因緣更相侵害我今受惱亦本行因緣雖非今世所作是我先世惡報我今償之應當甘受何可逆也譬如負債債主索之應當歡喜償債不可瞋也復次行者常行慈心雖有惱亂逼身必能忍受譬如羼提仙人在大林中修忍行慈時迦利王將諸婇女入林遊戲飲食既訖王小睡息諸婇女輩遊花林間見此仙人加敬禮拜在一面立仙人爾時為諸婇女讚説慈忍其言美妙聽者無厭久而不去迦利王覺不見婇女拔劍追蹤見在仙人前立憍妬隆盛瞋目奮劍而問仙人汝作何物仙人答言我今在此修忍行慈王言我今試汝當以利劍截汝耳鼻斬汝手足若不瞋者知汝修忍仙人言任意王即拔劍截其耳鼻斬其手足而問之言汝心動不答言我修慈忍心不動也王言汝一身在此無有勢力雖口言不動誰當信者是時仙人即作誓言若我實修慈忍血當為乳即時血變為乳王大驚喜將諸婇女而去是時林中龍神為此仙人雷電霹靂王被毒害沒不還宮以是故言於惱亂中能行忍辱復次菩薩修行悲心一切衆生常有衆苦處胎迫隘受諸苦痛生時迫迮骨肉如破冷風觸身甚於劍戟是故佛言一切苦中生苦最重如是老病死苦種種困厄云何行人復加其苦是為瘡中復加刀破復次菩薩自念我不應如諸餘人常隨生死水流我當逆流以求盡源入泥洹道一切凡人侵至則瞋益至則喜怖處則畏我為菩薩不可如彼雖未斷結當自抑制修行忍辱惱害不瞋敬養不喜衆苦艱難不應怖畏當為衆生興大悲心復次菩薩若見衆生來為惱亂當自念言是為我之親厚亦是我師益加親愛敬心待之何以故彼若不加衆惱惱我則我不成忍辱以是故言是我親厚亦是我師復次菩薩心知如佛所説衆生無始世界無際往來五道輪轉無量我亦曾為衆生父母兄弟衆生亦皆曾為我父母兄弟當來亦爾以是推之不應惡心而懷瞋害復次思惟衆生之中佛種甚多若我瞋意向之則為瞋佛若我瞋佛則為已了如説鴿鳥當得作佛今雖是鳥不可輕也復次諸煩惱中瞋為最重不善報中瞋報最大餘結無此重罪如釋提婆那民問佛偈言何物殺安隱何物殺不悔何物毒之根吞滅一切善何物殺而讚何物殺無憂佛答偈言殺瞋心安隱殺瞋心不悔瞋為毒之根瞋滅一切善殺瞋諸佛讚殺瞋則無憂菩薩思惟我今行悲欲令衆生得樂瞋為吞滅諸善毒害一切我當云何行此重罪若有瞋恚自失樂利云何能令衆生得樂復次諸佛菩薩以大悲為本從悲而出瞋為滅悲之毒特不相宜若壞悲本何名菩薩菩薩從何而出以是之故應修忍辱若衆生加諸瞋惱當念其功德今此衆生雖有一罪更自別有諸妙功德以其功德故不應瞋復次此人若罵若打是為治我譬如金師煉金垢隨火去真金獨在此亦如是若我有罪是從先世因緣今當償之不應瞋也當修忍辱復次菩薩慈念衆生猶如赤子閻浮提人多諸憂愁少有歡日若來罵詈或加讒賊心得歡樂此樂難得恣汝罵之何以故我本發心欲令衆生得歡喜故復次世間衆生常為衆病所惱又為死賊常隨伺之譬如怨家恆伺人便云何善人而不慈愍復欲加苦苦未及彼先自受害如是思惟不應瞋彼當修忍辱復次當觀瞋恚其咎最深三毒之中無重此者九十八使中此為最堅諸心病中第一難治瞋恚之人不知善不知非善不觀罪福不知利害不自憶念當墮惡道善言忘失不惜名稱不知他惱亦不自計身心疲惱瞋覆慧眼專行惱他如一五通仙人以瞋恚故雖修淨行殺害一國如旃陀羅復次瞋恚之人譬如虎狼難可共止又如惡瘡易發易壞瞋恚之人譬如毒蛇人不喜見積瞋之人惡心漸大至不可至殺父殺君惡意向佛如拘睒彌國比丘以小因緣瞋心轉大分為二部若欲斷當終竟三月猶不可了佛來在衆舉相輪手遮而告言汝諸比丘勿起鬪諍惡心相續苦報甚重汝求涅槃棄捨世利在善法中云何瞋諍世人忿諍是猶可恕出家之人何可諍鬪出家心中懷毒自害如冷雲中火出燒身諸比丘白佛言佛為法王願小默然是輩侵我不可不答佛念是人不可度也於衆僧中凌虛而去入林樹間寂然三昧瞋罪如是乃至不受佛語以是之故應當除瞋修行忍辱復次能修忍辱慈悲易得得慈悲者則至佛道問曰忍辱法皆好而有一事不可小人輕慢謂為怖畏以是之故不應皆忍答曰若以小人輕慢謂為怖畏而欲不忍不忍之罪甚於此也何以故不忍之人賢聖善人之所輕賤忍辱之人為小人所慢二輕之中寧為無智所慢不為賢聖所賤何以故無智之人輕所不輕賢聖之人賤所可賤以是之故當修忍辱復次忍辱之人雖不行布施禪定而常得微妙功德生天上人中後得佛道何以故心柔軟故復次菩薩思惟若人今世惱我毀辱奪利輕罵繫縛且當含忍若我不忍當墮地獄鐵垣熱地受無量苦燒炙燔煮不可具説以是故知小人無智雖輕而貴不忍用威雖快而賤是故菩薩應當忍辱復次菩薩思惟我初發心誓為衆生治其心病今此衆生為瞋恚結使所病我當治之云何而復以之自病應當忍辱譬如藥師療治衆病若鬼狂病拔刀罵詈不識好醜醫知鬼病但為治之而不瞋恚菩薩若為衆生瞋惱罵詈知其為瞋恚者煩惱所病狂心所使方便治之無所嫌責亦復如是復次菩薩育養一切愛之如子若衆生瞋惱菩薩菩薩愍之不瞋不責譬如慈父撫育子孫子孫幼稚未有所識或時罵詈打擲不敬不畏其父愍其愚小愛之愈至雖有過罪不瞋不恚菩薩忍辱亦復如是復次菩薩思惟若衆生瞋惱加我我當忍辱若我不忍今世心悔後入地獄受苦無量若在畜生作毒龍惡蛇師子虎狼若為餓鬼火從口出譬如人被火燒燒時痛輕後痛轉重復次菩薩思惟我為菩薩欲為衆生益利若我不能忍辱不名菩薩名為惡人復次菩薩思惟世有二種一者衆生數二者非衆生數我初發心誓為一切衆生若有非衆生數山石樹木風寒冷熱水雨侵害但求御之初不瞋恚今此衆生是我所為加惡於我我當受之云何而瞋復次菩薩知從久遠已來因緣和合假名為人無實人法誰可瞋者是中但有骨血皮肉譬如纍墼又如木人機關動作有去有來知其如此不應有瞋若我瞋者是則愚癡自受罪苦以是之故應修忍辱復次菩薩思惟過去無量恆河沙等諸佛本行菩薩道時皆先行生忍然後修行法忍我今求學佛道當如諸佛法不應起瞋恚如魔界法以是故應當忍辱如是等種種無量因緣故能忍是名生忍
