body:
  text: 聖者龍樹造後秦龜茲國三藏鳩摩羅什譯經復次舍利弗菩薩摩訶薩欲住內空外空內外空空空大空第一義空有為空無為空畢竟空無始空散空性空自相空諸法空不可得空無法空有法空無法有法空當學般若波羅蜜論內空者內法內法空內法者所謂內六入眼耳鼻舌身意眼空無我無我所無眼法耳鼻舌身意亦如是外空者外法外法空外法者所謂外六入色聲香味觸法色空者無我無我所無色法聲香味觸法亦如是內外空者內外法內外法空內外法者所謂內外十二入十二入中無我無我所無內外法問曰諸法無量空隨法故則亦無量何以但説十八若略説應一空所謂一切法空若廣説隨一一法空所謂眼空色空等甚多何以但説十八空答曰若略説則事不周若廣説則事繁譬如服藥少則病不除多則增其患應病投藥令不增減則能愈病空亦如是若佛但説一空則不能破種種邪見及諸煩惱若隨種種邪見説空空則過多人愛著空相墮在斷滅説十八空正得其中復次若説十若説十五俱亦有疑此非問也復次善惡之法皆有定數若四念處四正勤三十七品十力四無所畏四無礙智十八不共法五衆十二入十八界十二因緣三毒三結四流五蓋等諸法如是各有定數以十八種法中破著故説有十八空問曰般若波羅蜜空十八空為異為一若異者離十八空以何為般若空又如佛説何等是般若波羅蜜所謂色空受想行識空乃至一切種智空若不異者云何言欲住十八空當學般若波羅蜜答曰有因緣故言異有因緣故言一異者般若波羅蜜名諸法實相滅一切觀法十八空則十八種觀令諸法空菩薩學是諸法實相能生十八種空是名異一者十八空是空無所有相般若波羅蜜亦空無所有相十八空是捨離相般若波羅蜜一切法中亦捨離相是十八空不著相般若波羅蜜亦不著相以是故學般若波羅蜜則是學十八空不異故般若波羅蜜有二分有小有大欲得大者先當學小方便門欲得大智慧當學十八空住是小智慧方便門能得十八空何者是方便門所謂般若波羅蜜經讀誦正憶念思惟如説修行譬如人欲得種種好寶當入大海若人欲得內空等三昧智慧寶當入般若波羅蜜大海問曰行者云何學般若波羅蜜時住內空外空內外空答曰世間有四顛倒不淨中有淨顛倒苦中有樂顛倒無常中有常顛倒無我中有我顛倒行者為破四顛倒故修四念處十二種觀所謂初觀內身三十六種不淨充滿九孔常流甚可厭患淨相不可得淨相不可得故名內空行者既知內身不淨觀外所著亦復如是俱實不淨愚夫狂惑為淫欲覆心故謂之為淨觀所著色亦如我身淨相不可得是為外空行者若觀己身不淨或謂外色為淨若觀外不淨或謂己身為淨今俱觀內外我身不淨外亦如是外身不淨我亦如是一等無異淨不可得是名內外空行者思惟知內外身俱實不淨而惑者愛著愛著深故由以受身身為大苦而愚以為樂問曰三受皆外入所攝云何言觀內受答曰六塵初與六情和合生樂是名外樂後貪著深入生樂是名內樂復次內法緣樂是名內樂外法緣樂是名外樂復次五識相應樂是名外樂意識相應樂是名內樂麁樂名為外樂細樂名為內樂如是等分別內外樂苦受不苦不樂受亦如是復次行者思惟觀是內樂實可得不即分別知實不可得但為是苦強名為樂何以故是樂從苦因緣生亦生苦果報樂無厭足故苦復次如人患疥搔之向火疥雖小樂後轉傷身則為大苦愚人謂之為樂智者但見其苦如是世間樂顛倒病故著五欲樂煩惱轉多以是故行者不見樂但見苦如病如癰如瘡如刺復次樂少苦多少樂不現故名為苦如大河水投一合鹽則失鹽相不名為醎復次樂不定故或此以為樂彼以為苦彼以為樂此以為苦著者為樂失者為苦愚以為樂智以為苦見樂患為苦不見樂過者為樂不見樂無常相為樂見樂無常相為苦未離欲人以為樂離欲人以為苦如是等觀樂為苦觀苦如箭入身觀不苦不樂無常變異相如是等觀三種受心則捨離是名觀內受空觀外受內外受亦如是行者作是念若樂即是苦誰受是苦念已則知心受然後觀心為實為虛觀心無常生住滅相苦受心樂受心不苦不樂受心各各異念覺樂心滅而苦心生苦心爾所時住住已還滅次生不苦不樂心知爾所時不苦不樂心住住已還滅滅已還生樂心三受無常故心亦無常復次知染心無染心瞋心無瞋心癡心不癡心散心攝心縛心解脫心如是等心各各異相故知心無常無一定心常住受苦受樂等心從和合因緣生因緣離散心亦隨滅如是等觀內心外心內外心無常相問曰心是內入攝云何為外心答曰觀內身名為內心觀外身名為外心復次緣內法為內心緣外法為外心復次五識常緣外法不能分別故名為外心意識能緣內法亦分別好醜故名為內心復次意識初生未能分別決定是為外心意識轉深能分別取相是名內心如是等分別內外心行者心意轉異知身為不淨相知受為苦相知心不住為無常相結使未斷故或生吾我如是思惟若心無常誰知是心心為屬誰誰為心主而受苦樂一切諸物誰之所有即分別知無有別主但於五衆取相故計有人相而生我心以我心故生我所我所心生故有利益我者生貪欲違逆我者而生瞋恚此結使不從智生從狂惑生故是名為癡三毒為一切煩惱之根本亦由吾我故作福德為我後當得亦修助道法我當得解脫初取相故名為想衆因吾我起結使及諸善行是名行衆是二衆則是法念處於想行衆法中求我不可得何以故是諸法皆從因緣生悉是作法而不牢固無實我法行如芭蕉葉葉求之中無有堅相如遠見野馬無水有水想但誑惑於眼如是等觀內法外法內外法問曰法是外入攝云何為內法答曰內法名為內心相應想衆行衆外法名為外心相應想衆行衆及心不相應諸行及無為法一時等觀名為內外法復次內法名為六情外法名為六塵復次身受心及想衆行衆總觀為法念處何以故行者既於想衆行衆及無為法中求我不可得還於身受心中求亦不可得如是一切法中若色若非色若可見若不可見若有對若無對若有漏若無漏若有為若無為若遠若近若麁若細其中求我皆不可得但五衆和合故強名為衆生衆生即是我我不可得故亦無我所我所不可得故一切諸煩惱皆為衰薄復次身念處名一切色法行者觀內色無常苦空無我觀外色觀內外色亦如是受心法亦爾四念處內觀相應空三昧名內空四念處外觀相應空三昧名外空四念處內外觀相應空三昧名內外空問曰是空為是三昧力故空為是法自空答曰名為三昧力故空如經説三三昧三解脫門空無相無作是空三昧緣身受心法不得我我所故名為空問曰四念處空法皆應觀無常苦空無我何以故身觀不淨受觀苦心觀無常法觀無我答曰雖四法皆觀無常苦空無我而衆生身中多著淨顛倒受中多著樂顛倒心中多著常顛倒法中多著我顛倒以是故行者觀身不淨觀受苦觀心無常觀法無我復次內外空者無有內外定法互相因待故謂為內外彼以為外我以為內我以為外彼以為內隨人所繫內法為內隨人所著外法為外如人自舍為內他舍為外行者觀是內外法無定相故空復次是內外法無有自性何以故和合生故是內外法亦不在和合因緣中若因緣中無者餘處亦無內外法因緣亦無因果無故內外法空問曰內外法定有云何言無如手足等和合故有身法生是名內法如梁椽壁等和合故有屋法生是名為外是身法雖有別名亦不異足等所以者何若離足等身不可得故屋亦如是答曰若足不異身者頭應是足足與身不異故若頭是足者甚為可笑問曰若足與身不異者有如是過今應足等和合故更有法生名為身身雖異於足等應當依於足住如衆縷和合而能生㲲是㲲依縷而住答曰是身法為足等分中具有為分有若具有頭中應有足何以故身法具有故若分有與足分無異又身是一法所因者多一不為多多不為一復次若除足等分別有身者與一切世間皆相違背以是故身不得言即是諸分亦不得言異於諸分以是故則無身身無故足等亦無如是等名為內空房舍等外法亦如是空名為外空問曰破身舍等是為破一破異破一破異是破外道經佛經中實有內外法所謂內六情外六塵此云何無答曰是內外法和合假有名字亦如身如舍復次略説有二種空衆生空法空小乘弟子鈍根故為説衆生空我我所無故則不著餘法大乘弟子利根故為説法空即時知世間常空如涅槃聲聞論議師説內空於內法中無我無我所無常無作者無知者無受者是名內空外空亦如是不説內法相外法相即是空大乘説內法中無內法相外法中無外法相如般若波羅蜜中説色色相空受想行識識相空眼眼相空耳鼻舌身意意相空色色相空聲香味觸法法相空如是等一切諸法自法空問曰此二種説內外空何者是實答曰二皆是實但為小智鈍根故先説衆生空為大智利根者説法空如人閉獄破壞桎梏傷殺獄卒隨意得去又有怖畏盜穿牆壁亦得免出聲聞者但破吾我因緣生諸煩惱離諸法愛畏怖老病死惡道之苦不復欲本末推求了了壞破諸法但以得脫為事大乘者破三界獄降伏魔衆斷諸結使及滅習氣了知一切諸法本末通達無礙破散諸法令世間如涅槃同寂滅相得阿耨多羅三藐三菩提將一切衆生令出三界問曰大乘有何方便能破壞諸法答曰佛説色從種種因緣生無有堅實如水波浪而成泡沫暫見即滅色亦如是今世四大先世行業因緣和合故而得成色因緣滅故色亦俱滅行無常道轉入空門所以者何諸法生滅無有住時若無住時則無可取復次有為相故生時有滅滅時有生若已生生無所用若未生生無所生法與生亦不應有異何以故生若生法應有生生如是復應有生是則無窮若生生更無生者生不應有生若生無有生者法亦不應有生如是生不可得滅亦如是以是故諸法空不生不滅是為實復次諸法若有者終歸於無若後無者初亦應無如人著屐初已有故微細不覺若初無故則應常新若後有故相初亦有故法亦如是後有無故初亦有無以是故一切法應空以衆生顛倒著內六情故行者破是顛倒名為內空外空內外空亦如是空空者以空破內空外空內外空破是三空故名為空空復次先以法空破內外法復以此空破是三空是名空空復次空三昧觀五衆空得八聖道斷諸煩惱得有餘涅槃先世業因緣身命盡時欲放捨八道故生空空三昧是名空空問曰空與空空有何等異答曰空破五受衆空空破空問曰空若是法空為已破空若非法空何所破答曰空破一切法唯有空在空破一切法已空亦應捨以是故須是空空復次空緣一切法空空但緣空如一健兒破一切賊復更有人能破此健人空空亦如是又如服藥藥能破病病已得破藥亦應出若藥不出則復是病以空滅諸煩惱病恐空復為患是故以空捨空是名空空復次以空破十七空故名為空空大空者聲聞法中法空為大空如雜阿含大空經説生因緣老死若有人言是老死是人老死二俱邪見是人老死則衆生空是老死是法空摩訶衍經説十方十方相空是為大空問曰十方空何以名為大空答曰東方無邊故名為大亦一切處有故名為大遍一切色故名為大常有故名為大益世間故名為大令衆生不迷悶故名為大如是大方能破故名為大空餘空破因緣生法作法麁法易破故不名為大是方非因緣生法非作法微細法難破故名為大空問曰若佛法中無方三無為虛空智緣盡非智緣盡亦所不攝何以言有方亦是常是無為法非因緣生法非作法微細法答曰是方法聲聞論議中無摩訶衍法中以世俗諦故有第一義中一切法不可得何況方如五衆和合假名衆生方亦如是四大造色和合中分別此間彼間等假名為方日出處是則東方日沒處是則西方如是等是方相是方自然常有故非因緣生亦不先無今有今有後無故非作法非現前知故是微細法問曰方若如是云何可破答曰汝不聞我先説以世俗諦故有第一義故破以俗諦有故不墮斷滅中第一義破故不墮常中是名略説大空義問曰第一義空亦能破無作法無因緣法細微法何以不言大空答曰前已得大名故不名為大今第一義名雖異義實為大出世間以涅槃為大世間以方為大以是故第一義空亦是大空復次破大邪見故名為大空如行者以慈心緣東方一國土衆生復緣一國土衆生如是展轉緣時若謂盡緣東方國土則墮邊見若謂未盡則墮無邊見生是二見故即失慈心若以方空破是東方則滅有邊無邊見若不以方空破東方者則隨東方心隨心不已慈心則滅邪心則生譬如大海潮時至其常限水則旋還魚若不還則漂在露地有諸苦患若魚有智則隨水還永得安隱行者如是若隨心不還則漂在邪見若隨心還不失慈心如是破大邪見故名為大空第一義空者第一義名諸法實相不破不壞故是諸法實相亦空何以故無受無著故若諸法實相有者應受應著以無實故不受不著若受著者即是虛誑復次諸法中第一法名為涅槃如阿毗曇中説云何有上法一切有為法及虛空非智緣盡云何無上法智緣盡智緣盡是即涅槃涅槃中亦無涅槃相涅槃空是第一義空問曰若涅槃空無相云何聖人乘三種乘入涅槃又一切佛法皆為涅槃故説譬如衆流皆入于海答曰有涅槃是第一寶無上法是有二種一者有餘涅槃二無餘涅槃愛等諸煩惱斷是名有餘涅槃聖人今世所受五衆盡更不復受是名無餘涅槃不得言涅槃無以衆生聞涅槃名生邪見著涅槃音聲而作戲論若有若無以破著故説涅槃空若人著有是著世間若著無則著涅槃破是凡人所著涅槃不破聖人所得何以故聖人於一切法中不取相故復次愛等諸煩惱假名為縛若修道解是縛得解脫即名涅槃更無有法名為涅槃如人被械得脫而作戲論是械是腳何者是解脫是人可怪於腳械外更求解脫衆生亦如是離五衆械更求解脫法復次一切法不離第一義第一義不離諸法實相能使諸法實相空是名為第一義空如是等種種名為第一義空有為空無為空者有為法名因緣和合生所謂五衆十二入十八界等無為法名無因緣常不生不滅如虛空今有為法二因緣故空一者無我無我所及常相不變異不可得故空二者有為法有為法相空不生不滅無所有故問曰我我所及常相不可得故應空云何言有為法有為法相空答曰若無衆生法無所依又無常故無住時無住時故不可得知是故法亦空問曰有為法中常相不可得不可得者為是衆生空為是法空答曰有人言我心顛倒故計我為常是常空則入衆生空有人言以心為常如梵天王説是四大四大造色悉皆無常心意識是常是常空則入法空或有人言五衆即是常如色衆雖有變化而亦不滅餘衆如心説五衆空即是法空是故常空亦入法空中復次有為法無為法空者行者觀有為法無為法實相無有作者因緣和合故有皆是虛妄從憶想分別生不在內不在外不在兩中間凡夫顛倒見故有智者於有為法不得其相知但假名以此假名導引凡夫知其虛誑無實無生無作心無所著復次諸賢聖人不緣有為法而得道果以觀有為法空故於有為法心不繫著故復次離有為則無無為所以者何有為法實相即是無為無為相者則非有為但為衆生顛倒故分別説有為相者生滅住異無為相者不生不滅不住不異是為入佛法之初門若無為法有相者則是有為有為法生相者則是集諦滅相者則是盡諦若不集則不作若不作則不滅是名無為法如實相若得是諸法實相則不復墮生滅住異相中是時不見有為法與無為法合不見無為法與有為法合於有為法無為法不取相是為無為法所以者何若分別有為法無為法則於有為無為而有礙若斷諸憶想分別滅諸緣以無緣實智不墮生數中則得安隱常樂涅槃問曰前五空皆別説今有為無為空何以合説答曰有為無為法相待而有若除有為則無無為若除無為則無有為是二法攝一切法行者觀有為法無常苦空等過知無為法所益處廣是故二事合説問曰有為法因緣和合生無自性故空此則可爾無為法非因緣生法無破無壞常若虛空云何空答曰如先説若除有為則無無為有為實相即是無為如有為空無為亦空以二事不異故復次有人聞有為法過罪而著無為法以著故生諸結使如阿毗曇中説八十九有為法緣六無為法緣三當分別欲界繫盡諦所斷無明使或有為緣或無為緣何者有為緣盡諦所斷有為法緣使相應無明使何者無為緣盡諦所斷有為法緣使不相應無明使色無色界無明亦如是以此結使故能起不善業不善業故墮三惡道是故言無為法空無為法緣使疑邪見無明疑者於涅槃法中有耶無耶邪見者若生心言定無涅槃是邪疑相應無明及獨無明合為無明使問曰若云無為法空與邪見何異答曰邪見人不信涅槃然後生心言定無涅槃法無為空者破取涅槃相是為異復次若人捨有為著無為以著故無為即成有為以是故雖破無為而非邪見是名有為無為空畢竟空者以有為空無為空破諸法令無有遺餘是名畢竟空如漏盡阿羅漢名畢竟清淨阿那含乃至離無所有處欲不名畢竟清淨此亦如是內空外空內外空十方空第一義空有為空無為空更無有餘不空法是名畢竟空復次若人七世百千萬億無量世貴族是名畢竟貴不以一世二三世貴族為真貴也畢竟空亦如是從本已來無有定實不空者有人言今雖空最初不空如天造物始及冥初微塵是等皆空何以故果無常因亦無常如虛空不作果亦不作因天及微塵等亦應如是若是常不應生無常若過去無定相未來現在世亦如是於三世中無有一法定實不空者是名畢竟空問曰若三世都空乃至微塵及一念無所有者則是大可畏處諸智慧人以禪定樂故捨世間樂以涅槃樂故捨禪定樂今畢竟空中乃至無有涅槃依止何法得捨涅槃答曰有著吾我人以一異相分別諸法如是之人則以為畏如佛説凡夫人大驚怖處所謂無我無我所復次有為法有三世以有漏法故生著處涅槃名一切愛著斷云何於涅槃而求捨離復次如比丘破四重禁是名畢竟破戒不任得道又如作五逆罪畢竟閉三善道若取聲聞證者畢竟不得作佛畢竟空亦如是於一切法畢竟空無復有餘問曰一切法畢竟空是事不然何以故三世十方諸法乃至法相法住必應有實以有一法實故餘法為虛妄若無一法實者亦不應有諸虛妄法是畢竟空答曰無有乃至一法實者何以故若有乃至一法實者是法應有若有為若無為若是有為有為空中已破若是無為無為空中亦破如是世間出世間若世間內空外空內外空大空已破若出世間第一義空已破色法無色法有漏無漏法等亦如是復次一切法皆畢竟空是畢竟空亦空空無有法故亦無虛實相待復次畢竟空者破一切法令無遺餘故名畢竟空若小有遺餘不名畢竟若言相待故應有是事不然問曰諸法不盡空何以故因緣所生法空而因緣不空譬如梁椽因緣和合故名舍舍空而梁椽不應空答曰因緣亦空因緣不定故譬如父子父生故名為子生子故名為父復次最後因緣無所依止故如山河樹木衆生之類皆依止地地依止水水依止風風依止虛空虛空無所依止若本無所依止末亦無所依止以是故當知一切法畢竟空問曰不然諸法應有根本如神通有所變化所化雖虛而化主不空答曰凡夫人見所化物不久故謂之為空化主久故謂之為實聖人見化主復從前世業因緣和合生今世復集諸善法得神通力故能作化如般若波羅蜜後品中説有三種變化煩惱變化業變化法變化法法身也是故知化主亦空問曰諸不牢固者不實故應空諸牢固物及實法不應空如大地須彌山大海水日月金剛等色實法牢固故不應空所以者何地及須彌常住竟劫故衆川有竭海則常滿日月周天無有窮極又如凡人所見虛妄不真故應空聖人所得如及法性真際涅槃相應是實法云何言畢竟皆空復次有為法因緣生故不實無為法不從因緣生故應實復云何言畢竟空答曰堅固不堅固不定故皆空所以者何有人以此為堅固有人以此為不堅固如人以金剛為牢固帝釋手執如人捉杖不以為牢固又不知破金剛因緣故以為牢固若知著龜甲上以山羊角打破則知不牢固如七尺之身以大海為深羅睺阿修羅王立大海中膝出水上以兩手隱須彌頂下向觀忉利天喜見城此則以海水為淺若短壽人以地為常久牢固長壽者見地無常不牢固如佛説七日喻經佛告諸比丘一切有為法無常變異皆歸磨滅劫欲盡時大旱積久藥草樹木皆悉焦枯有第二日出諸小流水皆悉乾竭第三日出大河流水亦都涸盡第四日出閻浮提中四大河及阿那婆達多池皆亦空竭第五日出大海乾涸第六日出大地須彌山等皆悉煙出如窯燒器第七日出悉皆熾然無復煙氣地及須彌乃至梵天火皆然滿爾時新生光音天者見火怖畏言既燒梵宮將無至此先生諸天慰喻後生天言曾已有此正燒梵宮於彼而滅不來至此燒三千大千世界已無復灰炭佛語比丘如此大事誰信之者唯有眼見乃能信耳又比丘過去時須涅多羅外道師離欲行四梵行無量弟子亦得離欲須涅多羅作是念我不應與弟子同生一處今當深修慈心此人以深思慈故生光音天佛言須涅多羅者我身是也我是時眼見此事以是故當知牢固實物皆悉歸滅問曰汝説畢竟空何以説無常事畢竟空今即是空無常今有後空答曰無常則是空之初門若諦了無常諸法則空以是故聖人初以四行觀世間無常若見所著物無常無常則能生苦以苦故心生厭離若無常空相則不可取如幻如化是名為空外物既空內主亦空是名無我復次畢竟空是為真空有二種衆生一多習愛二多習見愛多者喜生著以所著無常故生憂苦為是人説汝所著物無常壞故汝則為之生苦若此所著物生苦者不應生著是名説無作解脫門見多者為分別諸法以不知實故而著邪見為是人故直説諸法畢竟空復次若有所説皆是可破可破故空所見既空見主亦空是名畢竟空汝言聖人所得法應實者以聖人法能滅三毒非顛倒虛誑能令衆生離老病死苦得至涅槃是雖名實皆從因緣和合生故先無今有今有後無故不可受不可著故亦空非實如佛説筏喻經善法尚應捨何況不善復次聖人有為無漏法從有漏法緣生有漏法虛妄不實緣所生法云何為實離有為法無無為法如先説有為法實相即是無為法以是故一切法畢竟不可得故名為畢竟空無始空者世間若衆生若法皆無有始如今生從前世因緣有前世復從前世有如是展轉無有衆生始法亦如是何以故若先生後死則不從死故生生亦無死若先死後有生則無因無緣亦不生而有死以是故一切法則無有始如經中説佛語諸比丘衆生無有始無明覆愛所繫往來生死始不可得破是無始法故名為無始空問曰無始是實不應破何以故若衆生及法有始者即墮邊見亦墮無因見遠離如是等過故應説衆生及法無始今以無始空破是無始則還墮有始見答曰今以無始空為破無始見又不墮有始見譬如救人於火不應著深水中今破是無始亦不應著有始中是則行於中道問曰云何破無始答曰以無窮故若無窮則無後無窮無後則亦無中若無始則為破一切智人所以者何若世間無窮則不知其始不知始故則無一切智人若有一切智人不名無始復次若取衆生相又取諸法一相異相以此一異相從今世推前世從前世復推前世如是展轉衆生及法始不可得則生無始見是見虛妄以一異為本是故應破如有為空破有為法是有為空即復為患復以無為空破無為法今以無始破有始無始即復為患復以無始空破是無始是名無始空問曰若爾者佛何以説衆生往來生死本際不可得答曰欲令衆生知久遠已來往來生死為大苦生厭患心如經説一人在世間計一劫中受身被害時聚集諸血多於海水啼泣出淚及飲母乳皆亦如是積集身骨過於毗浮羅山譬喻斬天下草木為二寸籌數其父祖曾祖猶不能盡又如盡以地為泥丸數其母及曾祖母猶亦不盡如是等無量劫中受生死苦惱初始不可得故心生怖畏斷諸結使如無常雖為邊而佛以是無常而度衆生無始亦如是雖為是邊亦以是無始而度衆生為度衆生令生厭心故説有無始非為實有所以者何若有無始不應説無始空問曰若無始非實法云何以度人答曰實法中無度人諸可説法語言度人皆是有為虛誑法佛以方便力故説是無始以無著心説故受者亦得無著無著故則生厭離復次以宿命智見衆生生死相續無窮是時為實若以慧眼則見衆生及法畢竟空以是故説無始空如般若波羅蜜中説常觀不實無常觀亦不實苦觀不實樂觀亦不實而佛説常樂為倒無常苦為諦以衆生多著常樂不著無常苦是故以無常苦諦破是常樂倒以是故説無常苦為諦若衆生著無常苦者説無常苦亦空有始無始亦如是無始能破著始倒若著無始復以無始為空是名無始空問曰有始法亦是邪見應當破何以但説破無始答曰有始是大惑所以者何若有始者初身則無罪福因緣而生善惡處若從罪福因緣而生不名為初身何以故若有罪福則從前身受後身故若世間無始無如是咎是故菩薩先已捨是麁惡邪見菩薩常習用無始念衆生故説無始常行因緣法故言法無始未得一切智故或於無始中錯謬是故説無始空復次無始已破有始不須空破有始今欲破無始故説無始空問曰若無始破有始者有始亦能破無始汝何以言但以空破無始答曰是二雖皆邪見而有差別有始起諸煩惱邪見因緣無始起慈悲及正見因緣所以者何念衆生受無始世苦惱而生悲心知從身次第生身相續不斷便知罪福果報而生正見若人不著無始即是助道善法若取相生著即是邪見如常無常見有始見雖破無始見不能畢竟破無始無始能畢竟破有始是故無始為勝如善破不善不善破善雖互相破而善能畢竟破惡如得賢聖道永不作惡惡法則不然勢力微薄故如人雖起五逆罪斷善根墮地獄久不過一劫因緣得脫地獄終成道果無始有始優劣不同亦如是以無始力大故能破有始是故不説有始空散空者散名別離相如諸法和合故有如車以輻輞轅轂衆合為車若離散各在一處則失車名五衆和合因緣故名為人若別離五衆人不可得問曰若如是説但破假名而不破色亦如離散輻輞可破車名不破輻輞散空亦如是但離散五衆可破人而不破色等五衆答曰色等亦是假名破所以者何和合微塵假名為色故問曰我不受微塵今以可見者為色是實為有云何散而為空答曰若除微塵四大和合因緣生出可見色亦是假名如四方風和合扇水則生沫聚四大和合成色亦如是若離散四大則無有色復次是色以香味觸及四大和合故有色可見除諸香味觸等更無別色以智分別各各離散色不可得若色實有捨此諸法應別有色而更無別色是故經言所有色皆從四大和合有和合有故皆是假名假名故可散問曰色假名故可散四衆無色云何可散答曰四陰亦是假名生老住無常觀故散而為空所以者何生時異老時異住時異無常時異故復次三世中觀是四衆皆亦散滅復次心隨所緣緣滅則滅緣破則破復次此四衆不定隨緣生故譬如火隨所燒處為名若離燒處火不可得因眼緣色生眼識若離所緣識不可得餘情識亦如是如經中説佛告羅陀此色衆破壞散滅令無所有餘衆亦如是是名散空復次譬如小兒聚土為臺殿城郭閭里宮舍或名為米或名為麵愛著守護日暮將歸其心捨離踏壞散滅凡夫人亦如是未離欲故於諸法中生愛著心若得離欲見諸法皆散壞棄捨是名散空復次諸法合集故各有名字凡夫人隨逐名字生顛倒染著佛為説法當觀其實莫逐名字有無皆空如迦旃延經説觀集諦則無無見觀滅諦則無有見如是種種因緣是名散空性空者諸法性常空假業相續故似若不空譬如水性自冷假火故熱止火停久水則還冷諸法性亦如是未生時空無所有如水性常冷諸法衆緣和合故有如水得火成熱衆緣若少若無則無有法如火滅湯冷如經説眼空無我無我所何以故性自爾耳鼻舌身意色乃至法等亦復如是問曰此經説我我所空是為衆生空不説法空云何證性空答曰此中但説性空不説衆生空及法空性空有二種一者於十二入中無我無我所二者十二入相自空無我無我所是聲聞論中説摩訶衍法説十二入我我所無故空十二入性無故空復次若無我無我所自然得法空以人多著我及我所故佛但説無我無我所如是應當知一切法空若我我所法尚不著何況餘法以是故衆生空法空終歸一義是名性空復次性名自有不待因緣若待因緣則是作法不名為性諸法中皆無性何以故一切有為法皆從因緣生從因緣生則是作法若不從因緣和合則是無法如是一切諸法性不可得故名為性空問曰畢竟空無所有則是性空今何以重説答曰畢竟空者名為無有遺餘性空者名為本來常爾如水性冷假火故熱止火則還冷畢竟空如虛空常不生不滅不垢不淨云何言同復次諸法畢竟空何以故性不可得故諸法性空何以故畢竟空故復次性空多是菩薩所行畢竟空多是諸佛所行何以故性空中但有因緣和合無有實性畢竟空三世清淨有如是等差別復次一切諸法性有二種一者總性二者別性總性者無常苦空無我無生無滅無來無去無入無出等別性者如火熱性水濕性心為識性如人喜作諸惡故名為惡性好集善事故名為善性如十力經中説佛知世間種種性如是諸性皆空是名性空何以故若無常性是實應失業果報所以者何生滅過去不住故六情亦不受塵亦不積習因緣若無積習則無誦經坐禪等以是故知無常性不可得無常尚不可得何況常相復次苦性亦不可得若實有是苦則不應生染著心若人厭畏苦痛於諸樂中亦應厭畏佛亦不應説三受苦受樂受不苦不樂受亦不應苦中生瞋樂中生愛不苦不樂中生癡若一相者樂中應生瞋苦中應生愛但是事不然如是等苦性尚不可得何況樂性虛妄而可得復次空相亦不可得所以者何若有空相則無罪福無罪福故亦無今世後世復次諸法相待有所以者何若有空應當有實若有實應當有空空性尚無何況有實復次若無我者則無縛無解亦無從今世至後世受罪福亦無業因緣果報如是等因緣知無我性尚不可得何況我性復次無生無滅性亦不實何以故若實則墮常見若一切法常則無罪無福若有者常有無者常無若無者不生有者不失如不生不滅性不可得何況生滅性無來無去無入無出等諸總性亦如是復次諸法別性是亦不然何以故如火能燒造色能照二法和合故名為火若離是二法有火者應別有火用而無別用以是故知火是假名亦無有實若實無火法云何言熱是火性復次熱性從衆緣生內有身根外有色觸和合生身識覺知有熱若未和合時則無熱性以是故知無定熱為火性復次若火實有熱性云何有人入火不燒及人身中火而不燒身空中火水不能滅以火無有定熱性故神通力故火不能燒身業因緣五藏不熱神龍力故水不能滅復次若熱性與火異火則非熱若熱與火一云何言熱是火性餘性亦如是是總性別性無故名為性空復次性空者從本已來空如世間人謂虛妄不久者是空如須彌金剛等物及聖人所知以為真實不空欲斷此疑故佛説是雖堅固相續久住皆亦性空聖人智慧雖度衆生破諸煩惱性不可得故是亦為空又人謂五衆十二入十八界皆空但如法性實際是其實性佛欲斷此疑故但分別説五衆如法性實際皆亦是空是名性空復次有為性三相生住滅無為性亦三相不生不住不滅有為性尚空何況有為法無為性尚空何況無為法以是種種因緣性不可得名為性空自相空者一切法有二種相總相別相是二相空故名為相空問曰何等是總相何等是別相答曰總相者如無常等別相者諸法雖皆無常而各有別相如地為堅相火為熱相問曰先已説性今説相性相有何等異答曰有人言其實無異名有差別説性則為説相説相則為説性譬如説火性即是熱相説熱相即是火性有人言性相小有差別性言其體相言可識如釋子受持禁戒是其性剃髮割截染衣是其相梵志自受其法是其性頂有周羅執三奇杖是其相如火熱是其性煙是其相近為性遠為相相不定從身出性則言其實如見黃色為金相而內是銅火燒石磨知非金性如人恭敬供養時似是善人是為相罵詈毀辱忿然瞋恚便是其性性相內外遠近初後等有如是差別是諸相皆空名為相空如説一切有為法皆是無常相所以者何生滅不住故先無今有已有還無故屬諸因緣故虛誑不真故無常因緣生故衆合因緣起故如是等因緣故一切有為法是無常相能生身心惱故名為苦身四威儀無不苦故苦聖諦故聖人捨不受故無時不惱故無常故如是等因緣名為苦相離我所故空因緣和合生故空無常苦空無我故名為空始終不可得故空誑心故名為空賢聖一切法不著故名為空以無相無作解脫門故名為空諸法實相無量無數故名為空斷一切語言道故名為空滅一切心行故名為空諸佛辟支佛阿羅漢入而不出故名為空如是等因緣故是名為空無常苦空故無我不自在故無我無主故名為無我諸法無不從因緣生從因緣生故無我無相無作故無我假名字故無我身見顛倒故無我斷我心得道故無我以是種種名為無我如是等名為總相別相者地堅相火熱相水濕相風動相眼識依處名眼相耳鼻舌身亦如是識覺相智慧相慧智相捨為施相不悔不惱為持戒相心不變異為忍相發勤為精進相攝心為禪相無所著為智慧相能成事為方便相識作生滅為世間相無識為涅槃相如是等諸法各有別相當知是諸相皆空是名自相空餘義如性空中説性相義同故問曰何以不但説相空而説自相空答曰若説相空不説法體空説自相空即法體空復次衆法和合故一法生是一法空如是等一一法皆空今和合因緣法展轉皆亦空一切法各各自相空以是故名為自相空問曰若一切法各各自相空云何復有所説答曰衆生顛倒故以一相異相總相別相等而著諸法為斷是故而有所説如是等因緣名為自相空一切法空者一切法名五衆十二入十八界等是諸法皆入種種門所謂一切法有相知相識相緣相增上相因相果相總相別相依相問曰云何一切法有相答曰一切法有好有醜有內有外一切法有心生故名為有問曰無法中云何言有相答曰若無法不名為法但以遮有故名為無法若實有無法則名為有是故説一切法有相知相者苦法智苦比智能知苦諦集法智集比智能知集諦滅法智滅比智能知滅諦道法智道比智能知道諦及世俗善智能知苦能知集能知滅能知道亦能知虛空非智緣滅是名一切法知相知相故攝一切法識相者眼識能知色耳識能知聲鼻識能知香舌識能知味身識能知觸意識能知法能知眼能知色能知眼識能知耳能知聲能知耳識能知鼻能知香能知鼻識能知舌能知味能知舌識能知身能知觸能知身識能知意能知法能知意識是名識相緣相者眼識及眼識相應諸法能緣色耳識及耳識相應諸法能緣聲鼻識及鼻識相應諸法能緣香舌識及舌識相應諸法能緣味身識及身識相應諸法能緣觸意識及意識相應諸法能緣法能緣眼能緣色能緣眼識能緣耳能緣聲能緣耳識能緣鼻能緣香能緣鼻識能緣舌能緣味能緣舌識能緣身能緣觸能緣身識能緣意能緣法能緣意識是名緣相增上相者一切有為法各各增上無為法亦於有為法有增上是名增上相因果相者一切法各各為因各各為果是名因果相總相別相者一切法中各各有總相別相如馬是總相白是別相如人是總相若失一耳則是別相如是各各展轉皆有總相別相是為總相別相依相者諸法各共相依止如草木山河依止於地地依止水如是一切各各相依是名依止相依止相攝一切法如是等一法門相攝一切法復次二法門攝一切法所謂色無色法可見不可見法有對無對法有漏無漏法有為無為法內法外法觀法緣法有法無法如是等種種二法門相三四五六乃至無量法門相攝一切法是諸法皆空如上説名一切法空問曰若皆空者何以説一切法種種名字答曰凡夫人於空法中無明顛倒取相故生愛等諸煩惱因煩惱故起種種業起種種業故入種種道入種種道故受種種身受種種身故受種種苦樂如蠶出絲無所因自從己出而自纏裹受燒煮苦聖人清淨智慧力故分別一切法本末皆空欲度衆生故説其著處所謂五衆十二入十八界等汝但以無明故而生五衆等自作自著若聖人但説空者不能得道以無所因無所厭故問曰汝言一切法空是事不然何以故一切法各各自相攝故如地堅相水濕相火熱相風動相心為識相慧為知相如是一切法各自住其相云何言空答曰性空自相空中已破今當更説相不定故不應是相如酥蜜膠蠟等皆是地相與火合故自捨其相轉成濕相金銀銅鐵與火合故亦自捨其相變為水相如水得寒成氷轉為地相如人醉睡入無心定凍氷中魚皆無心識捨其心相無所覺知如慧為知相入諸法實相則無所覺知自捨知相是故諸法無有定相復次若謂諸法定相是亦不然所以者何如未來法相不應來至現在若至現在則捨未來相若不捨未來相入現在者未來則是現在為無未來果報若現在入過去則捨現在相若不捨現在相入過去過去則是現在如是等過則知諸法無有定相復次若謂無為法定有者應別自有相如火自有熱相不因他作相是故當知無為法無相故實無復次汝以未來世中非智緣滅法是有為法而無有為相若汝謂以非智緣盡是滅相是亦不然所以者何無常滅故是名滅相非以非智緣滅故名為滅相如是等種種無有定相若有定相可使不空而無定相而不空者是事不然問曰應實有法不空所以者何凡夫聖人所知各異凡夫所知是虛妄聖人所知是實依實聖智故捨虛妄法不可依虛妄捨虛妄答曰為破凡夫所知故名為聖智若無凡夫法則無聖法如無病則無藥是故經言離凡夫法更無聖法凡夫法實性即是聖法復次聖人於諸法不取相亦不著是故聖法為真實凡夫於諸法取相亦著故以凡夫人法為虛妄聖人雖用而不取相不取相故則無定相如是不應為難於凡夫地著法分別是聖法是凡夫法若於賢聖地則無所分別為斷衆生病故言是虛是實如説佛語非虛非實非縛非解不一不異是故無所分別清淨如虛空復次若法不悉空不應説不戲論為智人相亦不應説不受不著無所依止空無相無作名為真法問曰若一切法空即亦是實云何言無實答曰若一切法空假令有法已入一切法中破若無法不應致難問曰若一切法空是真實者佛三藏中何以多説無常苦空無我法如經説佛告諸比丘為汝説法名為第一義空何等是第一義空眼生無所從來滅亦無所去但有業有業果報作者不可得耳鼻舌身意亦復如是是中若説生無所從來滅亦無所去是常常法不可得故無常但有業及業果報而作者不可得是為聲聞法中第一義空云何言一切法空答曰我是一切諸煩惱根本先著五衆為我然後著外物為我所我所縛故而生貪恚貪恚因緣故起諸業如佛説無作者則破一切法中我若説眼無所從來滅亦無所去則説眼無常若無常即是苦苦即是非我我所我我所無故於一切法中心無所著心無所著故則不生結使不生結使何用説空以是故三藏中多説無常苦空無我不多説一切法空復次衆生雖聞佛説無常苦空無我而戲論諸法為是人故説諸法空若無我亦無我所若無我無我所是即入空義問曰佛何以説有業有果報若有業有果報是則不空答曰佛説法有二種一者無我一者無法為著見神有常者故為説無作者為著斷滅見者故為説有業有業果報若人聞説無作者轉墮斷滅見中為説有業有業果報此五衆能起業而不至後世此五衆因緣生五衆受業果報相續故説受業果報如母子身雖異而因緣相續故如母服藥兒病得差如是今世後世五衆雖異而罪福業因緣相續故從今世五衆因緣受後世五衆果報復次有人求諸法相著一法若有若無若常若無常等以著法故自法生愛他法生恚而起惡業為是人故説諸法空諸法空則無有法所以者何所可愛法能生結使能生結使則是無明因緣若生無明云何是實是為法空復次衆生有二種一者著世間二者求出世間求出世間有上中下上者利根大心求佛道中者中根求辟支佛道下者鈍根求聲聞道為求佛道者説六波羅蜜及法空為求辟支佛者説十二因緣及獨行法為求聲聞者説衆生空及四真諦法聲聞畏惡生死聞衆生空及四真諦無常苦空無我不戲論諸法如圍中有鹿既被毒箭一向求脫更無他念辟支佛雖厭老病死猶能少觀甚深因緣亦能少度衆生譬如犀在圍中雖被毒箭猶能顧戀其子菩薩雖厭老病死能觀諸法實相究盡深入十二因緣通達法空入無量法性譬如白香象王在獵圍中雖被箭射顧視獵者心無所畏及將營從安步而去以是故三藏中不多説法空或有利根梵志求諸法實相不厭老病死著種種法相為是故説法空所謂先尼梵志不説五衆即是實亦不説離五衆是實復有強論梵志佛答我法中不受有無汝何所論有無是戲論法結使生處及雜阿含中大空經説二種空衆生空法空羅陀經中説色衆破裂分散令無所有筏喻經中説法尚應捨何況非法波羅延經利衆經中説智者於一切法不受不著若受著法則生戲論若無所依止則無所論諸得道聖人於諸法無取無捨若無取捨能離一切諸見如是等三藏中處處説法空如是等名為一切法空不可得空者有人言於衆界入中我法常法不可得故名為不可得空有人言諸因緣中求法不可得如五指中拳不可得故名為不可得空有人言一切法及因緣畢竟不可得故名為不可得空問曰何以故名不可得空為智力少故不可得為實無故不可得答曰諸法實無故不可得非智力少也問曰若爾者與畢竟空自相空無異今何以故更説不可得空答曰若人聞上諸空都無所有心懷怖畏生疑今説所以空因緣以求索不可得故為説不可得空斷是疑怖故佛説不可得空所以者何佛言我從初發心乃至成佛及十方佛於諸法中求實不可得是名不可得空問曰何事不可得答曰一切法乃至無餘涅槃不可得故名為不可得空復次行者得是不可得空不得三毒四流四縛五蓋六愛七使八邪九結十惡諸弊惡垢結等都不可得故名為不可得空問曰若爾者行是不可得空得何等法利答曰得戒定慧得四沙門果五根五無學衆六捨法七覺分八聖道分九次第定十無學法得如是等是聲聞法若得般若波羅蜜則具足六波羅蜜及十地諸功德問曰上言一切法乃至涅槃不可得今何以言得戒定慧乃至十無學法答曰是法雖得皆助不可得空故亦名不可得又復無受無著故是名不可得為無為法故名不可得聖諦故名不可得第一義諦故名不可得聖人雖得諸功德入無餘涅槃故不以為得凡夫人以為大得如師子雖有所作不自以為奇餘衆生見以為希有如是等義名為不可得空無法空有法空無法有法空無法空者有人言無法名法已滅是滅無故名無法空有法空者諸法因緣和合生故無有法有法無故名有法空無法有法空者取無法有法相不可得是為無法有法空復次觀無法有法空故名無法有法空復次行者觀諸法生滅若有門若無門生門生喜滅門生憂行者觀生法空則滅喜心觀滅法空則滅憂心所以者何生無所得滅無所失除世間貪憂故是名無法有法空復次十八空中初三空破一切法後三空亦破一切法有法空破一切法生時住時無法空破一切法滅時無法有法空生滅一時俱破復次有人言過去未來法空是名無法空現在及無為法空是名有法空何以故過去法滅失變異歸無未來法因緣未和合未生未有未出未起以是故名無法觀知現在法及無為法現有是名有法是二俱空故名為無法有法空復次有人言無為法無生住滅是名無法有為法生住滅是名有法如是等空名為無法有法空是為菩薩欲住內空乃至無法有法空當學般若波羅蜜
