body:
  text: 聖者龍樹造後秦龜茲國三藏鳩摩羅什譯經爾時三千大千世界諸四天王天等各與無數百千億諸天俱來在會中三千大千世界諸釋提桓因等諸忉利天須夜魔天王等諸夜魔天刪兜率陀天王等諸兜率陀天須涅蜜陀天王等諸妙化天婆舍跋提天王等諸自在行天各與無數百千億諸天俱來在會中三千大千世界諸梵天王乃至首陀婆諸天等各與無數百千億諸天俱來在會中是諸四天王天乃至首陀婆諸天業報生身光明於佛常光百分千分萬億分不能及一乃至不可以算數譬喻為比世尊光明最勝最妙最上第一諸天業報光明在佛常光邊不照不現譬如焦炷比閻浮檀金爾時釋提桓因白大德須菩提是三千大千世界諸四天王天乃至首陀婆諸天一切和合欲聽須菩提説般若波羅蜜義須菩提菩薩摩訶薩云何應住般若波羅蜜中何等是菩薩摩訶薩般若波羅蜜云何菩薩摩訶薩應行般若波羅蜜須菩提語釋提桓因言憍尸迦我今當承順佛意承佛神力為諸菩薩摩訶薩説般若波羅蜜如菩薩摩訶薩所應住般若波羅蜜中諸天子今未發阿耨多羅三藐三菩提心者應當發諸天子若入聲聞正位是人不能發阿耨多羅三藐三菩提心何以故與生死作障隔故是人若發阿耨多羅三藐三菩提心者我亦隨喜所以者何上人應更求上法我終不斷其功德憍尸迦何等是般若波羅蜜菩薩摩訶薩應薩婆若心念色無常念色苦念色空念色無我念色如病如疽癰瘡如箭入身痛惱衰壞憂畏不安以無所得故受想行識亦如是眼耳鼻舌身意地種水火風空識種觀無常乃至憂畏不安是亦無所得故觀色寂滅離不生不滅不垢不淨受想行識亦如是觀地種乃至識種寂滅離不生不滅不垢不淨亦無所得故復次憍尸迦菩薩摩訶薩應薩婆若心觀無明緣諸行乃至老死因緣大苦聚集亦無所得故觀無明滅故諸行滅乃至生滅故老死滅老死滅故憂悲愁惱大苦聚滅以無所得故復次憍尸迦菩薩摩訶薩應薩婆若心修四念處以無所得故乃至修佛十力十八不共法以無所得故復次憍尸迦菩薩摩訶薩應薩婆若心行檀波羅蜜以無所得故行尸羅波羅蜜羼提波羅蜜毗梨耶波羅蜜禪波羅蜜以無所得故復次憍尸迦菩薩摩訶薩行般若波羅蜜時作是觀但諸法諸法共相因緣潤益增長分別校計是中無我無我所菩薩回向心不在阿耨多羅三藐三菩提心中阿耨多羅三藐三菩提心不在回向心中回向心於阿耨多羅三藐三菩提心中不可得阿耨多羅三藐三菩提心於回向心中亦不可得菩薩雖觀一切法亦無法可得是名菩薩摩訶薩般若波羅蜜釋提桓因問大德須菩提云何菩薩回向心不在阿耨多羅三藐三菩提心中云何阿耨多羅三藐三菩提心不在回向心中云何回向心於阿耨多羅三藐三菩提心中不可得云何阿耨多羅三藐三菩提心於回向心中不可得須菩提語釋提桓因言憍尸迦回向心阿耨多羅三藐三菩提心非心是非心相非心相中不可回向是非心相常非心相不可思議相常不可思議相是名菩薩摩訶薩般若波羅蜜爾時佛讚須菩提言善哉善哉須菩提汝為諸菩薩摩訶薩説般若波羅蜜安慰諸菩薩摩訶薩心須菩提白佛言世尊我應報恩不應不報恩過去諸佛及諸弟子為諸菩薩説六波羅蜜示教利喜世尊爾時亦在中學得阿耨多羅三藐三菩提我今亦當為諸菩薩説六波羅蜜示教利喜令得阿耨多羅三藐三菩提論問曰初品中佛放殊勝光明諸天大集此間何以更説答曰有人言此是後會有人言即是前會天以須菩提善能説深般若波羅蜜諸天歡喜以是故佛微笑常光益更發明諸天光明不復現如日出時星月燈燭無復光明譬如焦炷在閻浮檀金邊四天王天者東方名提多羅吒秦言治國主乾闥婆及毗舍闍南方名毗流離秦言增長主拘槃茶及薜荔多西方名毗流波叉秦言雜語主諸龍王及富多那北方名鞞沙門秦言多聞主夜叉及羅剎釋提桓因釋迦秦言能提婆秦言天因提秦言主合而言之釋提婆那民須夜磨夜摩天王名也秦言妙善刪兜率陀兜率陀天王名也秦言妙足須涅蜜陀秦言化樂婆舍跋提秦言他化自在天此間一梵天王名尸棄秦言火從梵天乃至首陀婆天秦言淨居天業報生身光者欲界天以燈燭明珠等施及布施持戒禪定等清淨故身常光明不須日月色界天行禪離欲修習火三昧故身常出妙光勝於日月及欲界報光明離欲天取要言之是諸天光明皆由心清淨故得佛常光明者面各一丈諸天光明大者雖無量由旬於佛光邊蔽而不現釋提桓因見佛神力光明作是念佛光明能蔽諸天光智慧之明亦當能破我等愚暗又以佛命須菩提説般若是故言一切諸天皆大集會欲聽須菩提説般若義今大福德諸天皆集欲聞般若義云何是般若波羅蜜者是問般若波羅蜜體云何行者是問初入方便行云何住者問深入究竟住須菩提受其語作是答若人飢渴給足飲食感恩則深菩薩亦如是發心求佛道為是人説般若則大得利益感恩亦深是故説般若未發心者當發已入聖道者則不堪任以漏盡無有後生故如是等因緣故言不任問曰若是人不任者何以故言是人若發心者我亦隨喜不障其功德上人應更求上法答曰須菩提雖是小乘常習行空故不著聲聞道以是故假設言若發心有何咎此中須菩提自説二因緣一者不障其福德心二者上人應更求上法以是故上人求阿耨多羅三藐三菩提無咎若上人求小法是可恥以中間傍及餘事故更稱問何等是般若波羅蜜者所謂應薩婆若心觀色無常苦空無我如先説觀五衆能生諸惱故言如病有人聞五衆如病謂為輕微故言如癰疽有人以癰疽雖難愈猶或可差故言如箭鏑入體不可得出有人以箭鏑在體雖沈深難拔良方妙術猶可令出故言常痛惱如人著衰常有不吉五衆亦如是若人隨逐則無安隱以有衰故常懷憂怖是五衆如與師子虎狼共住常懷憂畏是五衆無常虛誑等過故常不安隱問曰五衆但有此十五種惡更有餘事答曰略説則十五廣説則無量無邊如雜阿含中呵五衆有百種罪過問曰何以常説無常苦空無我或時説八事如病如癰疽等餘七事少有説處答曰人有上中下為利根故説四即入苦諦中根者説四則不能生厭心説如病如癰等八事則生厭心鈍根人聞是八事猶不生厭更為説痛惱等七事然後乃厭利根易度故常多説四事鈍根人時有可度者故希説餘事上八事名為聖行餘七事凡夫聖人共行初四入十六聖行故般若中常説又説般若為菩薩利根故多説聖行今問云何是初行法故此中都説十二入乃至六種等亦應如是呵十八界等亦應具説誦者忘失所以者何此十八界等諸法皆是五衆別名故不應不説若行者觀五衆等寂滅遠離不生不滅不垢不淨等此但為般若波羅蜜故不合上十五説十五事三乘共故聲聞人智力薄故初始不能觀五衆若遠離若寂滅等但能觀無常等入第三諦乃能觀寂滅菩薩利根故初觀五衆便得寂滅相用無所得者常用無所得空慧觀諸法相復次釋提桓因問般若波羅蜜相不問五衆患厭事但説般若相般若相者不離五衆有涅槃不離涅槃有五衆五衆實相即是涅槃是故初發心鈍根者先用無常等觀然後觀五衆寂滅等十二因緣亦如是復次修四念處乃至八聖道分是共法應薩婆若心以無所得者是名般若波羅蜜相六波羅蜜乃至十八不共法獨是大乘法問曰應説般若波羅蜜相行何以故中間説諸法諸法更相因緣潤益增長答曰須菩提上先説諸法無常等過後説諸法遠離寂滅無所得空然後説諸法雖空從因緣和合故有次説四念處乃至十八不共法行佛道聽者作是念上説遠離寂滅空故知非常説十二因緣故知不滅而無知者見者誰修行是諸法得佛是故説菩薩作是念諸法空無我無衆生而從因緣故有四大六識是十法各各有力能生能起能有所作如地能持水能爛火能消風能回轉識能分別是十法各有所作衆生顛倒故謂是人作我作如皮骨和合故有語聲或者謂人語如火燒乾竹林出大音聲此中無有作者又如木人幻人化人雖能動作無有作者此十法亦如是前生法後生法因緣或共生因緣或相應因緣或報因緣等常修常集因緣令果報增長如春殖果樹隨時溉灌華果繁茂以智慧分別知一切諸法無有作者菩薩初發意回向與佛心作因緣而初發意回向時未有佛心佛心中無初回向心雖無而能作因緣問曰若初發心回向時無菩提心者何所回向答曰般若波羅蜜實相中諸法非常相非無常相非有相非無相故不應難言回向心已滅無所有云何與菩提作因若諸法不生不滅非不生非不滅云何以不生不滅作難無菩提心何所回向復次佛自説菩提相非過去非未來非現在云何難言未來無菩提故何所回向復次如如品中説過去世不離未來世未來世不離過去世過去世如未來世如一如無二云何説菩提心不在回向心中回向心不在菩提心中但菩薩聞是讚歎佛法發心愛樂我所有功德皆回向佛道從發心已來乃至佛道修是功德不休不息用如幻如夢無所得故是名菩薩般若波羅蜜能知諸法因緣生果報而無有定相釋提桓因難何以故回向心不在菩提心中可得菩提心不在回向心中可得須菩提不以世諦如幻如夢説但以第一義諦説是二心皆空非心相何以故諸法畢竟空中無是心非心如是法云何可有回向若有二法可有回向譬如乘車西行南有止宿處故回車趣向車與回向處異故可有回向不得但有車而言回向無異故非心相常非心相者須菩提意謂是心相如常住不生不滅不垢不淨以非心相故非心亦無是非心是故説不可思議不可思議亦常不可思議不可籌量思惟取相以是因緣故阿耨多羅三藐三菩提所因心似果不似則不能生若初心不淨後不能發淨心如鍊鐵不能成金佛以須菩提深入因緣般若波羅蜜中此是般若波羅蜜名也以能深得諸法因緣故即以為名無有違錯故於大衆中讚言善哉善哉汝是小乘人而能善説深般若波羅蜜安慰諸菩薩心者以般若波羅蜜教諸菩薩汝莫自以煩惱未盡未成佛道故而自懈廢諸法無礙初心後心無有異相但勤精進則成佛道我應報恩者須菩提作是念我行此諸法實相得脫老病死苦我云何不念是法大恩以是故常樂説法復次佛有大悲心樂説法度衆生我以佛恩故得道我亦助佛説法度衆生是為報恩又知今世尊因過去諸佛得成佛道是故我亦愛敬過去佛如子愛敬父故亦愛重於祖又亦愛敬過去諸菩薩及弟子能説法教示故今世尊亦因此得成須菩提深心信三寶故説我知今世尊及法過去諸佛及弟子恩法即是法寶今佛過佛即是佛寶諸菩薩及弟子即是僧寶六波羅蜜如先説示者示人好醜善不善應行不應行生死為醜涅槃安隱為好分別三乘分別六波羅蜜如是等名示教者教言汝捨惡行善是名教利者未得善法味故心則退沒為説法引導令出汝莫於因時求果汝今雖勤苦果報出時大得利益令其心利故名利喜者隨其所行而讚歎之令其心喜若樂布施者讚布施則喜故名喜以此四事莊嚴説法經爾時須菩提語釋提桓因言憍尸迦汝今當聽菩薩摩訶薩般若波羅蜜中如所應住所不應住憍尸迦色色空受想行識識空菩薩菩薩空是色空菩薩空不二不別受想行識空菩薩空不二不別憍尸迦菩薩摩訶薩般若波羅蜜中應如是住復次眼眼空乃至意意空菩薩菩薩空眼空乃至菩薩空不二不別六塵亦如是地種地種空乃至識種識種空菩薩菩薩空憍尸迦地種空乃至識種空菩薩空不二不別憍尸迦菩薩摩訶薩般若波羅蜜中應如是住無明無明空乃至老死老死空無明滅無明滅空乃至老死滅老死滅空菩薩菩薩空憍尸迦無明空乃至老死空無明滅空乃至老死滅空菩薩空不二不別憍尸迦菩薩摩訶薩般若波羅蜜中應如是住檀波羅蜜乃至般若波羅蜜內空乃至無法有法空四念處乃至十八不共法一切三昧門一切陀羅尼門聲聞乘辟支佛乘佛乘聲聞辟支佛菩薩佛亦如是一切種智一切種智空菩薩菩薩空一切種智空菩薩空不二不別憍尸迦菩薩摩訶薩般若波羅蜜中應如是住爾時釋提桓因問須菩提云何菩薩般若波羅蜜中所不應住須菩提言憍尸迦菩薩摩訶薩不應色中住以有所得故不應受想行識中住以有所得故不應眼中住乃至不應意中住不應色中住乃至不應法中住眼識乃至意識眼觸乃至意觸眼觸因緣生受乃至意觸因緣生受中不應住以有所得故地種乃至識種中不應住以有所得故檀波羅蜜乃至般若波羅蜜四念處乃至十八不共法中不應住以有所得故須陀洹果中不應住以有所得故乃至阿羅漢果辟支佛道菩薩道佛道一切種智不應住以有所得故復次憍尸迦菩薩摩訶薩色是常不應住色是無常不應住受想行識亦如是色若樂若苦若淨若不淨若我若無我若空若不空若寂滅若不寂滅若離若不離不應住以有所得故受想行識亦如是復次憍尸迦菩薩摩訶薩須陀洹果無為相斯陀含果無為相阿那含果無為相阿羅漢果無為相不應住辟支佛道無為相佛道無為相不應住須陀洹福田不應住斯陀含阿那含阿羅漢辟支佛佛福田不應住復次憍尸迦菩薩摩訶薩初地中不應住以有所得故乃至第十地中不應住以有所得故復次菩薩摩訶薩住初發心中我當具足檀波羅蜜不應住乃至我當具足般若波羅蜜不應住具足六波羅蜜當入菩薩位不應住入菩薩位已當住阿鞞跋致地不應住菩薩當具足五神通不應住以有所得故菩薩住五神通已我當遊無量阿僧祇佛界禮敬供養諸佛聽法聽法已為他人説菩薩摩訶薩如是不應住以有所得故如諸佛世界嚴淨我亦當莊嚴世界不應住以有所得故成就衆生令入佛道不應住到無量阿僧祇世界諸佛所尊重愛敬供養以香華瓔珞澤香搗香幢幡華蓋百千億種寶衣供養諸佛不應住以有所得故我當令無量阿僧祇衆生發阿耨多羅三藐三菩提心如是菩薩不應住我當生五眼肉眼天眼慧眼法眼佛眼不應住我當生一切三昧門不應住隨所欲遊戲諸三昧不應住我當生一切陀羅尼門不應住我當得佛十力不應住我當得四無所畏四無礙智十八不共法不應住我當具足大慈大悲不應住我當具足三十二相不應住我當具足八十隨形好不應住以有所得故是八人是信行人是法行人如是不應住須陀洹極七世生不應住家家不應住須陀洹命終垢盡不應住須陀洹中間入涅槃不應住是人向斯陀含果證不應住是人斯陀含一往來入涅槃不應住是人向阿那含果證不應住斯陀含一種不應住是人阿那含彼間入涅槃不應住是人向阿羅漢果證不應住是人阿羅漢今世入無餘涅槃不應住是辟支佛不應住過聲聞辟支佛地我當住菩薩地不應住道種智中不應住以有所得故一切種一切法知已斷諸煩惱及習不應住佛得阿耨多羅三藐三菩提當轉法輪不應住作佛事度無量阿僧祇衆生入涅槃不應住四如意足中不應住入是三昧住如恆河沙等劫壽不應住我當得壽命無殃數劫不應住三十二相一一相百福莊嚴不應住我一世界如十方恆河沙等世界不應住我三千大千世界純是金剛不應住使我菩提樹當出如是香衆生聞者無有淫欲瞋恚愚癡亦無聲聞辟支佛心是一切人必當得阿耨多羅三藐三菩提若衆生聞是香者身病意病皆悉除盡不應住當使我世界中無有色受想行識名字不應住當使我世界中無有檀波羅蜜名字乃至無有般若波羅蜜名字當使我世界中無有四念處名字乃至無有十八不共法名字亦無須陀洹名字乃至無有佛名字不應住以有所得故何以故諸佛得阿耨多羅三藐三菩提時一切諸法無所得故如是憍尸迦菩薩於般若波羅蜜中不應住以無所得故爾時舍利弗心念菩薩今云何應住般若波羅蜜中須菩提知舍利弗心所念語舍利弗言於汝意云何諸佛何所住舍利弗語須菩提諸佛無有住處諸佛不色中住不受想行識中住不有為性中住不無為性中住不四念處中住乃至不十八不共法中住不一切種智中住舍利弗菩薩摩訶薩般若波羅蜜中應如是住如諸佛住於諸法中非住非不住舍利弗菩薩摩訶薩般若波羅蜜中應如是學我當住不住法故論者言般若波羅蜜中住者所謂五衆五衆相空五衆相空者以十八空觀故復次般若波羅蜜經中説空義五衆相空但凡夫顛倒故取五衆相五衆和合中取菩薩相般若波羅蜜中以衆生空除衆生即是無菩薩相以法空除五衆則無五衆相二空無有別異故言五衆空菩薩空無二無別如栴檀火滅糞草木火滅滅法無異取未滅時相於滅時説故有別異於滅中則無異乃至一切種智亦如是不應住者所謂五衆中不應住問曰應説如住義何以故説不住答曰若能於五衆中心離不住則是住義是故説以有所得故不應住乃至一切種智亦如是先説五衆中不應住不知以何門不應住今説常無常等門中不應住乃至遠離不應住問曰須陀洹果等無為相不應住有何次第答曰菩薩先觀諸法空無所有心退沒欲取涅槃涅槃即是無為相是故今説須陀洹果等無為相不應住若是須陀洹果無為相則無法可著何所愛何所取若是有為相有為相則虛誑無實亦不應住是故説須陀洹果無為相不應住乃至佛無為相不應住亦如是如菩薩欲行佛道初行檀波羅蜜應求福田所以者何福田因緣功德故所願得滿如種良田則所收益多如佛説餘田果報有量賢聖田無量果報亦無量菩薩聞是須陀洹等福田果報無量故便欲作須陀洹以是故説須陀洹福田不應住乃至辟支佛亦如是問曰二乘小故應過不住佛福田何故不住答曰菩薩法於諸法應平等若以佛為大衆生為小則破等法相復次空故一切處不應住復次菩薩應等心布施若分別福田則破大悲亦破三分清淨布施初地中不應住者若不捨初地則不得二地求大益故應捨小利復次以著心取相故不應住乃至第十地亦如是問曰若菩薩摩訶薩法從初發心應行六波羅蜜行六波羅蜜故入法位入法位故應住阿鞞跋致地住阿鞞跋致地已應起五神通供養十方諸佛如後廣説今何以故皆言不應住答曰不破清淨住但破計我邪見取相心住譬如治田去其穢草復次為斷法愛故不應住不欲違諸佛説畢竟空智慧故不應住若以方便不著心憐愍衆生故雖住無咎乃至八十種隨形好亦如是八人者所謂見諦道中信行法行須陀洹極久七世生有須陀洹今世煩惱盡得阿羅漢有家家須陀洹三世生三世生已入涅槃有中間須陀洹除第三餘中間入涅槃住六無礙五解脫中者皆是須陀洹向斯陀含斷欲界六種結生天上從天上來生人間入涅槃名斯陀含斷欲界第七分結名向阿那含斷第八分結亦名向阿那含又名一種子斯陀含此間死彼間生入涅槃能斷欲界一切結使名阿那含此間死生色無色界入涅槃更不復來生有今世滅阿那含有中陰滅阿那含有即生時入涅槃阿那含有生已修起諸行入涅槃阿那含有不勤求諸行入涅槃阿那含有上行乃至阿迦膩吒阿那含有生無色界入涅槃阿那含有得身證入涅槃阿那含是名阿那含亦名向阿羅漢阿羅漢有九種漏盡捨身時名入無餘涅槃過聲聞辟支佛地住菩薩地道種智一切種智知一切法斷一切煩惱及習成佛轉法輪三十二相莊嚴世界度無量衆生無量壽命皆如先論議中説聲聞人善修四如意足得是三昧力能住壽若一劫若減一劫菩薩善修四如意三昧若欲如恆河沙劫壽亦得如意三千大千世界純是金剛者餘世界雖底有金剛及佛所行所坐處有金剛而餘處皆無是菩薩所願世界皆是金剛菩提樹香度衆生者如先義中説問曰此中事雖希有皆可信無有色受想行識名字無檀波羅蜜名字乃至佛名字是難可信答曰有世界大福德智慧人生處樹木虛空土地山水等常出諸法實相之音所有法皆是不生不滅不淨不垢空無相無作等衆生生便聞是音自然得無生法忍如是世界中不須分別説諸法名字所謂是五衆十二入等檀波羅蜜乃至十八不共法須陀洹乃至諸佛是世界中衆生皆有三十二相八十隨形好莊嚴身無量光明一種道一種果是中不應住者菩薩自念我能生如是世界則生高心以是故不應取相住此中須菩提自説不住因緣諸佛得佛道時於諸法中不得定實相故當何所住今舍利弗作是念若都無所住當住何處得成佛道須菩提知舍利弗心之所念語舍利弗諸菩薩皆是佛子子法應如父所行諸佛心於一切法中無所住所謂色乃至一切種智菩薩亦應如是學用無所住心行般若波羅蜜如諸佛無所住心中亦不住非不住心中亦不住畢竟清淨故諸菩薩亦應隨佛住畢竟清淨故諸菩薩亦應隨佛學經爾時會中有諸天子作是念諸夜叉言語字句所説尚可了知須菩提所説言語論義解釋般若波羅蜜了不可知須菩提知諸天子心所念語諸天子不解不知耶諸天子言大德不解不知須菩提語諸天子汝等法應不知我無所論説乃至不説一字亦無聽者何以故諸字非般若波羅蜜般若波羅蜜中無聽者諸佛阿耨多羅三藐三菩提無字無説諸天子如佛化作化人是化人復化作四部衆比丘比丘尼優婆塞優婆夷化人於四部衆中説法於汝意云何是中有説者有聽者有知者不諸天子言不也大德須菩提言一切法皆如化此中無説者無聽者無知者諸天子譬如人夢中見佛説法於汝意云何是中有説者有聽者有知者不諸天子言不也大德須菩提語諸天子一切法皆如夢無説無聽無知者諸天子譬如二人在大深澗各住一面讚佛法衆有二嚮出於諸天子意云何是二人嚮展轉相解不諸天子言不也大德須菩提語諸天子一切法亦如是無説無聽無知者諸天子譬如工幻師於四衢道中化作佛及四部衆於中説法於諸天子意云何是中有説者有聽者有知者不諸天子言不也大德須菩提語諸天子一切諸法如幻無説者無聽者無知者爾時諸天子心念須菩提所説欲令易解轉深轉妙須菩提知諸天子心所念語諸天子言色非深非妙受想行識非深非妙色性非深非妙受想行識性非深非妙眼性乃至意性色性乃至法性眼界性乃至意界性眼識乃至意識眼觸乃至意觸眼觸因緣生受乃至意觸因緣生受檀波羅蜜乃至般若波羅蜜內空乃至無法有法空四念處乃至十八不共法一切諸三昧門一切陀羅尼門乃至一切種智一切種智性非深非妙諸天子復作是念是所説法中不説色不説受想行識不説眼乃至意觸因緣生受不説檀波羅蜜乃至般若波羅蜜不説內空乃至無法有法空不説四念處乃至十八不共法不説陀羅尼門三昧門乃至一切種智不説須陀洹果乃至阿羅漢果不説辟支佛道不説阿耨多羅三藐三菩提道是法中不説名字語言須菩提知諸天子心所念語諸天子言如是如是諸天子是法中諸佛得阿耨多羅三藐三菩提不可説相是中亦無説者無聽者無知者以是故諸天子善男子善女人欲住須陀洹果欲證須陀洹果者是人不離是忍斯陀含阿那含阿羅漢果辟支佛道佛道欲住欲證不離是忍如是諸天子菩薩摩訶薩從初發心般若波羅蜜中應如是住以無説無聽故論問曰諸夜叉語雖隱覆不正而事則鄙近説深般若波羅蜜雖用常辭而幽旨玄遠事異趣乖何以相況答曰諸天適以人所不解況已未悟不必事趣皆同以為喻也有人言天帝九百九十九門門皆以十六青衣夜叉守之此諸夜叉語言浮偽情趣妖諂諸天賤之不以在意是故不解其言而其意況可不須言辨而識故言尚可了知今聞深般若言似可及而玄旨幽邃尋之雖深而失之逾遠故以夜叉言況其叵知又以夜叉語雖難解眼見相傳以其言度其心則皆可知譬如深淵駛水得船可渡須菩提所説般若波羅蜜畢竟空義無有定相不可取不可傳譯得悟不得言有不得言無不得言有無不得言非有非無非非有非非無亦無一切心行處滅言語道斷故是故諸天子驚疑迷悶須菩提答諸天子汝所不解者汝自應爾是法無所一説乃至不説一字可著可取無字無語是諸佛道何以故是名字皆空虛誑無實如破色名字中説用名字則有語言若無名字則無語言諸天子作是念若無説若無聽今日和合聚會為何所作須菩提欲解此義故以譬喻明之諸天子復作是念欲以譬喻解悟我等而此譬喻轉更深妙譬喻以麁喻細以定事明不定今此譬喻亦微妙無定相須菩提知諸天子心於深般若中迷沒不能自出是故説般若波羅蜜不異五衆五衆實相即是般若波羅蜜今是五衆非深非妙乃至一切種智非深非妙諸天子爾時深知須菩提口雖説色心無所説乃至阿耨多羅三藐三菩提亦如是須菩提知諸天子心答言如是如是非我獨爾佛得菩提時亦無説寂滅相實無説者聽者是故須陀洹果乃至佛道皆因無為法而有離是法離是忍則無須陀洹乃至佛道亦如是菩薩初發心乃至得佛於其中間一切法無説無聞諸觀滅故語言斷故不可説不可説故不可聽不可聽故不可知不可知故於一切法無受無著則入涅槃
