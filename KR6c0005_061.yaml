body:
  text: 聖者龍樹造後秦龜茲國三藏鳩摩羅什譯經爾時彌勒菩薩摩訶薩語慧命須菩提有菩薩摩訶薩隨喜福德與一切衆生共之回向阿耨多羅三藐三菩提以無所得故若聲聞辟支佛福德若一切衆生福德若布施若持戒若修定若隨喜是菩薩摩訶薩隨喜福德與一切衆生共之回向阿耨多羅三藐三菩提其福最上第一最妙無上無與等者何以故聲聞辟支佛及一切衆生布施持戒修定隨喜為自調為自淨為自度故所謂四念處乃至八聖道分空無相無作菩薩隨喜福德回向阿耨多羅三藐三菩提持是功德為調一切衆生為淨一切衆生為度一切衆生故起爾時慧命須菩提白彌勒菩薩言諸菩薩摩訶薩念十方無量無邊阿僧祇世界中無量無邊阿僧祇諸滅度佛是佛從初發心至得阿耨多羅三藐三菩提乃至入無餘涅槃乃至法盡於其中間諸善根應六波羅蜜及諸聲聞人善根若布施福德持戒福德修定福德及諸學人無漏善根無學人無漏善根諸佛戒衆定衆慧衆解脫衆解脫知見衆一切智大慈大悲及餘無量阿僧祇諸佛法及諸佛所説法是法中學得須陀洹果乃至得阿羅漢果辟支佛道入菩薩摩訶薩位及餘衆生種諸善根是諸善根一切和合隨喜福德回向阿耨多羅三藐三菩提最上第一最妙無上無與等者如是隨喜已持是隨喜福德回向阿耨多羅三藐三菩提若有善男子行菩薩乘者作是念我是心回向阿耨多羅三藐三菩提是生心緣事若善男子取相回向阿耨多羅三藐三菩提如所念可得不彌勒菩薩語須菩提是善男子行菩薩乘回向阿耨多羅三藐三菩提心是緣事若善男子取相不得如所念須菩提語彌勒菩薩若諸緣諸事無所有是善男子行菩薩乘者取相於十方諸佛諸善根從初發心乃至法盡及聲聞辟支佛諸善根學無學善根一切和合隨喜功德回向阿耨多羅三藐三菩提以無相故是菩薩將無顛倒無常謂常想顛倒心顛倒見顛倒不淨謂淨苦謂樂無我謂我想顛倒心顛倒見顛倒若如緣如事阿耨多羅三藐三菩提亦如是回向心亦如是檀波羅蜜尸羅羼提毗梨耶禪般若波羅蜜乃至十八不共法亦如是若爾者何等是緣何等是事何等是阿耨多羅三藐三菩提何等是善根何等是隨喜心回向阿耨多羅三藐三菩提論釋曰先七品中佛命須菩提令説般若中間帝釋多問多説功德事今彌勒順佛本意還欲令須菩提因隨喜法廣説般若波羅蜜復次帝釋聞上供養般若以華香妓樂幡蓋之具得福甚多深自慶幸此供養具唯我等能辦非出家人所有是故彌勒欲抑其自多之情故語須菩提菩薩但以心隨喜則勝聲聞辟支佛一切衆生布施等及諸無漏功德何況華香供養經卷等菩薩摩訶薩義如先説隨喜福德者不勞身口業作諸功德但以心方便見他修福隨而歡喜作是念一切衆生中能修福行道者最為殊勝若離福德人與畜生同行三事三事者淫欲飲食戰鬪能修行福德行道之人一切衆生所共尊重愛敬譬如熱時清涼滿月無不樂仰亦如大會告集伎樂肴饌無不畢備遠近諸人咸共欣赴修福之人亦復如是福德有二種樂因緣世間出世間出世間者諸無漏法雖無福報能生福德故名福德是故有漏無漏通名福德復次福德是菩薩摩訶薩根本能滿所願一切聖人所讚歎無智人所毀呰智人所行處無智人所遠離是福德因緣故作人王轉輪聖王天王阿羅漢辟支佛諸佛世尊大慈大悲十力四無所畏一切種智自在無礙皆從福德中生如是等種種福德得正見故隨而歡喜復次菩薩自念我應與一切衆生樂而衆生能自行福德是故心生歡喜復次一切衆生行善與我相似是我同伴是故隨喜諸菩薩摩訶薩於十方三世諸佛及菩薩聲聞辟支佛及一切修福衆生布施持戒修定慧於此福德中生隨喜福德是故名隨喜持是隨喜福德共一切衆生回向阿耨多羅三藐三菩提共一切衆生者是福德不可得與一切衆生而果報可與菩薩既得福德果報衣服飲食等世間樂具以利益衆生菩薩以福德清淨身口人所信受為衆生説法令得十善道四禪等與作後世利益末後成佛得福德果報身有三十二相八十種隨形好無量光明觀者無厭無量清淨梵音柔和無礙解脫等諸佛法於三事示現度無量阿僧祇衆生般涅槃後碎身舍利與人供養久後皆令得道是果報可與一切衆生以果中説因故言福德與衆生共若福德可以與人者諸佛從初發心所集福德盡可與人然後更作善法體不可與人今直以無畏無惱施與衆生用無所得故者義如先説是名菩薩摩訶薩隨喜福德比一切聲聞辟支佛及衆生三種福德中最勝最上第一最妙無上無與等義如先説是中説勝因緣是二乘福德皆為自調自淨自度持戒者是自調修禪者是自淨智慧者是自度復次自調者正語正業正命自淨者正念正定自度者正見正思惟正方便復次布施因緣故自調持戒因緣故自淨修定因緣故自度修定者是無漏法近因緣無漏者所謂三十七品三解脫門等布施持戒遠故不解菩薩隨喜福德雖無勤勞為度一切衆生故勝問曰實不度一切衆生何以言度一切衆生故勝答曰諸佛菩薩功德力能度一切衆生但以衆生無和合因緣故譬如大火常有燒力但以薪不近故不得燒近則能燒爾時須菩提以畢竟空智慧難問彌勒菩薩念諸佛福德隨喜回向無上道是所念過去事是事如所念不彌勒以二因緣故答言不也一者過去無量阿僧祇劫諸佛久已滅度無復遺餘菩薩或無宿命智或有而不能及但以如所聞憶想分別故不如所念二者諸佛及功德出三界出三世斷戲論語言道如涅槃相畢竟空清淨隨喜者分別諸佛及諸弟子善根功德是回向心及無上道非實故言不也須菩提難言若無是事是菩薩憶念分別應墮顛倒若是事畢竟空清淨相憶念亦如是諸過去佛功德亦如是無分別無異云何得隨喜是略説義廣則如經説所謂須菩提問彌勒若菩薩摩訶薩憶念過去十方無量無邊阿僧祇世界中諸滅度佛者是菩薩欲起隨喜福德佛是福德主是故念佛聞經書説有過去佛名故因是名廣念一切過去諸佛從初發心者初發心作願我當度一切衆生是心相應三善根不貪不瞋不癡善根相應諸善法及善根所起身心口業和合是法名為福德從初發心行六波羅蜜入菩薩位得十地乃至坐道場是中菩薩自修福德和合得佛道乃至入無餘涅槃滅度後舍利及遺法皆是佛自身功德和合因諸佛大乘人行六波羅蜜相應福德相應者除六波羅蜜餘菩薩所行法皆攝入六波羅蜜中故説應六波羅蜜和合若求聲聞辟支佛人種布施持戒修定等福德聲聞辟支佛人有二種一者漏盡名為無學二者得道漏未盡名為學是二人諸福德中善根勝故但説善根上言求二乘人者總凡夫聖人今學無學者純是聖人相好是無記色法非是善功德故但説佛五無學衆大慈大悲佛法義如初品中説諸佛所説法學是法得須陀洹果乃至入菩薩位者是佛滅度後遺法中得道是故重説及餘衆生種諸善根者此是佛在世及遺法中天人乃至畜生種福德因緣是上四段福德行者心遍緣憶念隨喜求佛道故回向名無上隨喜最上無與等問曰求佛道者何以不自作功德而心行隨喜答曰諸菩薩以方便力他勤勞作功德能於中起隨喜者福德勝自作者復次是隨喜福德即是實福德所以者何念過去佛即是念佛三昧亦是六念中念佛念法念僧念戒念捨念天等因行清淨戒入禪定起畢竟智慧和合故能起正隨喜是故不但隨喜而已亦行是實法是心回向者即是隨喜心緣者隨喜心所緣所謂一切諸佛及一切衆生所作功德事者若是所緣之本福德是緣功德所住處所謂諸佛及衆生并土地山林精舍住處皆名事如所念可得不彌勒答言不也須菩提語彌勒若諸事諸緣無所有者云何不墮顛倒顛倒者四顛倒三種分別此顛倒是譬喻無佛而憶想念佛猶如無常而念常不淨而念淨問曰見為諸顛倒本如得初道人能起想心顛倒無見顛倒以見諦道斷故答曰是顛倒生時異斷時異生時想在前次是心後是見斷時先斷見見諦所斷故顛倒體皆是見相見諦所斷想心顛倒者學人未離欲憶念忘故取淨相起結使還得正念即時滅如經中譬喻如渧水墮大熱鐵上即時消滅小錯故假名顛倒非實顛倒是故説凡夫人三種顛倒學人二種顛倒復次諸緣諸事如實畢竟空念亦空菩提亦空隨喜心亦空檀波羅蜜乃至十八不共法亦空若諸法一相所謂無相此中何等是緣何等是事何等是心回向無上道經彌勒菩薩語須菩提若諸菩薩摩訶薩久行六波羅蜜多供養諸佛種善根與善知識相隨善學自相空法是諸菩薩是緣是事諸佛諸善根隨喜福德不取相回向阿耨多羅三藐三菩提以不二法非不二法非相非不相非可得法非不可得法非淨非垢不生不滅法是名回向阿耨多羅三藐三菩提若諸菩薩不久行六波羅蜜不多供養諸佛不種善根不與善知識相隨不善學自相空法是諸菩薩是諸緣是諸事諸佛諸善根隨喜福德諸心取相回向阿耨多羅三藐三菩提是不名回向須菩提如是般若波羅蜜義乃至一切種智義所謂內空乃至無法有法空不應為新學菩薩説何以故是菩薩所有少許信樂恭敬清淨心皆亡失當在阿鞞跋致菩薩摩訶薩前説若有為善知識所護若久供養諸佛種諸善根應為是人説如是般若波羅蜜義乃至一切種智義所謂內空乃至無法有法空是人聞是法不沒不驚不畏不怖須菩提菩薩摩訶薩隨喜福德應如是回向阿耨多羅三藐三菩提所謂菩薩用心隨喜功德回向阿耨多羅三藐三菩提是心盡滅變離是緣是事是諸善根亦盡滅變離是中何等是隨喜心何等是諸緣何等是諸事何等是諸善根隨喜回向阿耨多羅三藐三菩提二心不俱是心性亦不可得回向菩薩云何隨喜心回向阿耨多羅三藐三菩提若菩薩摩訶薩行般若波羅蜜時如是知是般若波羅蜜無有法乃至檀波羅蜜亦無有法色無有法受想行識乃至阿耨多羅三藐三菩提無有法菩薩摩訶薩應如是隨喜功德回向阿耨多羅三藐三菩提若能如是回向是名隨喜功德回向阿耨多羅三藐三菩提論釋曰彌勒意以諸法甚深隨喜心微妙所謂不壞諸法相而隨喜心回向無上道是事甚難凡夫人心剛強不能行是法是故彌勒答言若行者久修六波羅蜜諸功德深厚故不動所謂能信能行多供養諸佛種善根故集無量無邊阿僧祇功德結使折損其心柔軟此是先世因緣今世得好師好同學亦自學諸法實相空巧方便故不著是空如是等種種無量因緣故諸法雖無相而能起隨喜心回向無上道譬如鐵雖堅䩕入爐則柔軟隨作何器菩薩心亦如是久行六波羅蜜善知識所護故其心調柔過去諸佛諸緣諸事諸善根中不取相能起隨喜心用無相回向無上道無相者能用不二非不二乃至不生不滅等與上相違者是名不能回向彌勒知須菩提樂説空故語言如是般若波羅蜜隨喜義不應新學菩薩前説何以故若有少福德善根者聞是畢竟空法即著空作是念若一切法畢竟空無所有者我何為作福德則忘失善業以是故新發意菩薩先教取相隨喜漸得方便力爾乃能行無相隨喜譬如鳥子羽翼未成不可逼令高翔六翮成就則能遠飛阿鞞跋致菩薩入法位得法忍能信能行故可為説若有久行六波羅蜜與善知識相隨內福德外因緣力助雖非阿鞞跋致能信能行是二種人聞是心清淨歡喜信受如久飢渴者得好飲食如大熱得涼大寒得溫其心愛樂歡喜是二菩薩亦如是得是無相智慧作是念我因是智慧能度無量衆生何況有驚懼恐怖恐怖從我心中出是法中諸法相尚空何況有我而決定取諸法相聞一切法無相則生驚懼是説隨喜義體竟後當更以種種異門釋上事復次須菩提菩薩應如是思惟用是心回向無上道是心念念盡滅變離無有住時是諸緣事所謂過去諸佛及諸善根諸佛等諸緣事久已滅隨喜心今滅既滅無異是故經中説用是心回向是心即盡滅如是等入過去世故入諸法實相故無有分別是心是緣是事是善根等若能如是回向是為正回向復次一時二心不和合隨喜心時無菩提心一切心相畢竟空不可以取相回向何以故菩薩知般若波羅蜜空無有定法如般若波羅蜜一切法乃至無上道亦如是是時斷法愛捨著心於空無諍是名菩薩正回向經爾時釋提桓因語須菩提新發意菩薩聞是事將無驚懼怖畏須菩提云何新發意菩薩作諸善根回向阿耨多羅三藐三菩提復云何隨喜福德回向阿耨多羅三藐三菩提須菩提語釋提桓因若新發意菩薩行般若波羅蜜不受是般若波羅蜜以無所得故無相故乃至檀波羅蜜亦如是多信解內空乃至多信解無法有法空多信解四念處乃至十八不共法常與善知識相隨是善知識為説六波羅蜜義開示分別如是教授令常不離般若波羅蜜乃至得入菩薩法位終不離般若波羅蜜乃至不離檀波羅蜜不離四念處乃至十八不共法亦教語魔事聞種種魔事已不增不減何以故是菩薩摩訶薩不受一切法故是菩薩亦常不離諸佛乃至得菩薩位於中種善根以是善根故生菩薩家乃至得阿耨多羅三藐三菩提終不離是善根復次新發意菩薩摩訶薩於過去十方無量無邊阿僧祇世界中諸佛斷生死道斷諸戲論道盡棄重擔滅聚落刺斷諸有結正智得解脫及弟子所作功德於中若剎利大姓婆羅門大姓居士大家四天王天乃至淨居天所種善根是一切和合稱量以隨喜心最上第一最妙無上無與等者回向阿耨多羅三藐三菩提爾時彌勒菩薩語須菩提若新發意菩薩摩訶薩念諸佛及弟子諸善根隨喜功德最上第一最妙無上無與等者隨喜已應回向阿耨多羅三藐三菩提云何菩薩不墮想顛倒心顛倒見顛倒須菩提言若菩薩摩訶薩念諸佛及僧於中不生佛想不生僧想無善根想用是心回向阿耨多羅三藐三菩提是心中亦不生心想菩薩如是回向想不顛倒心不顛倒見不顛倒若菩薩摩訶薩念諸佛及僧善根取相取相已回向阿耨多羅三藐三菩提菩薩如是名為想顛倒心顛倒見顛倒若菩薩摩訶薩用是心念諸佛及僧諸善根是心念時即知盡滅若盡滅是法不可得回向所用回向心亦是盡滅相所回向處法亦如是相若如是回向是名正回向非邪回向菩薩摩訶薩應如是回向阿耨多羅三藐三菩提復次若菩薩摩訶薩過去諸佛善根及弟子善根是中凡夫人聞法種善根若諸天龍夜叉揵闥婆阿修羅迦樓羅緊那羅摩睺羅伽聞法種善根若剎利大姓婆羅門大姓居士大家四天王天乃至阿迦尼吒天聞法種善根發阿耨多羅三藐三菩提心是一切福德和合稱量隨喜功德最上第一最妙無上無與等者回向阿耨多羅三藐三菩提是時菩薩若如是知是諸法盡滅所回向處法亦自性空能如是回向是名真回向阿耨多羅三藐三菩提復次若菩薩如是知無有法能回向法何以故一切法自性空故若如是回向是名正回向阿耨多羅三藐三菩提如是菩薩摩訶薩行般若波羅蜜乃至檀波羅蜜不墮想顛倒心顛倒見顛倒何以故菩薩不著是回向亦不見以諸善根回向菩提心處是名菩薩摩訶薩無上回向論問曰新發意菩薩聞是事將無怖畏驚懼者耶此義先已問答今何以復問答曰上彌勒雖語須菩提不應為新學説可為阿鞞跋致及久行者説是二種人聞能信行已説正回向因緣而猶説空法是故帝釋疑言是衆中有新發意者云何更説使不恐怖須菩提欲成彌勒所説欲令新發意者應正回向故答帝釋若新發意菩薩雖不久行六波羅蜜不供養諸佛而以利根得善知識是二因緣故堪任正回向是故語帝釋新發意菩薩行般若波羅蜜不受是般若以無所得故畢竟空故般若波羅蜜亦不得亦不著乃至檀波羅蜜亦如是多信解內空者常修樂入觀內空三昧故信解乃至十八不共法多信解亦如是善知識相如先説此中但明能隨六波羅蜜義説聞是義已常不離般若波羅蜜乃至得入菩薩法位有久行入菩薩位有新發意入菩薩位復次是新發意菩薩善知識為説魔事聞魔事已不增不減以善修習諸法實相故若魔欲破為欲破空空則無破若有增益如幻如夢何所增益是故説不增不減是因緣故常不離諸佛常生菩薩家世世不離善根乃至無上道是新發意菩薩得如是因緣與久發意無異復次隨喜回向所謂新發意菩薩於過去十方無量阿僧祇世界中諸佛斷道者斷生死道入無餘涅槃諸戲論斷故言滅諸戲論以空空等三昧捨八聖道分故言道盡五衆能生苦惱故是重擔五衆有二種捨一者有餘涅槃中捨五衆因緣諸煩惱二者入無餘涅槃中捨五衆果一切白衣舍名為聚落出家人依白衣舍活而白衣舍有五欲刺為食故來入惡刺果林以取果故為刺所刺如人著木屐踐刺刺則摧折如是諸佛以禪定智慧屐摧五欲刺名滅斷下五分結有分結盡名斷上分五結諸法實相金剛三昧相應智慧斷一切煩惱及習故言正智得解脫如是等皆名讚歎過去諸佛及弟子所作功德者佛弟子有三種菩薩辟支佛聲聞剎利大姓乃至淨居天是中種善根者是四種福田因是種福德處是福德和合稱量隨喜心最上無與等回向無上道是回向心作正非邪所以者何今彌勒問須菩提若新發意菩薩念諸佛等功德回向無上道云何不墮顛倒須菩提答若是菩薩以般若波羅蜜方便力故於諸佛不生佛想及弟子想諸善根中不生善根想一切法從和合生無有自性故無有定法名為佛是故不生佛等想是回向心亦不生心想是故菩薩不墮顛倒與上相違即墮顛倒復次菩薩以是心念諸佛等及諸善根是心盡時即知盡盡心不得回向何以故變失滅壞故是心亦入無常門到法性中法性中無有分別是心是非心是佛是弟子是善根是無上道回向心回向處盡相亦如是初心是憶念過去諸佛等隨喜功德後心是回向心若如是回向是名正回向問曰初心後心是生滅相可無常所回向處法是無上道在未來世中云何言盡滅答曰汝不聞我先答入無常門到法性中此中不説盡是無常但説諸法實相是盡先亦説阿耨多羅三藐三菩提出三世過三界無受相能如是回向者是為正回向復次非正非邪回向所謂菩薩於過去諸佛善根等乃至無上無與等回向無上道若菩薩知是事皆盡滅知回向處法亦自性空能知滅知空是真回向若過去法無常無常故不可回向自性空法中若過去法空空故不可回向自性空法中用如是智慧回向是名正回向復次若菩薩知一切法因緣生故無自力常住自法相不動況能有所作無所作故一切法中無有法能回向法是名正回向如是菩薩雖行般若波羅蜜等諸善法亦不墮顛倒一切法不著故經復次若菩薩摩訶薩知所起福德離五衆十二入十八界亦知般若波羅蜜是離相乃至檀波羅蜜是離相內空乃至無法有法空是離相四念處乃至十八不共法是離相如是菩薩摩訶薩隨喜心起福德回向阿耨多羅三藐三菩提復次若菩薩摩訶薩隨喜福德知隨喜福德自性離亦知諸佛離佛性諸善根亦離善根性菩提心菩提心性亦離回向回向性亦離菩薩菩薩性亦離般若波羅蜜般若波羅蜜性亦離禪波羅蜜毗梨耶波羅蜜羼提波羅蜜尸羅波羅蜜檀波羅蜜檀波羅蜜性亦離乃至十八不共法十八不共法性亦離菩薩摩訶薩應如是行離相般若波羅蜜是名菩薩摩訶薩般若波羅蜜中生隨喜福德復次菩薩摩訶薩諸過去滅度佛諸善根若欲回向應如是回向作是念如諸佛滅度相諸善根相亦如是滅度法相亦如是我用心回向是心相亦如是若能如是回向當知是回向阿耨多羅三藐三菩提不墮想顛倒心顛倒見顛倒若菩薩摩訶薩行般若波羅蜜時取諸佛善根相回向阿耨多羅三藐三菩提是不名為回向何以故諸過去佛及善根非相緣非無相緣若菩薩摩訶薩作如是取相是不名善根回向阿耨多羅三藐三菩提如是菩薩摩訶薩墮想顛倒心顛倒見顛倒若菩薩摩訶薩諸佛及諸善根及諸心不取相是名以諸善根回向阿耨多羅三藐三菩提是菩薩摩訶薩不墮想顛倒心顛倒見顛倒爾時彌勒菩薩問須菩提云何菩薩摩訶薩於諸善根不取相能回向阿耨多羅三藐三菩提須菩提言以是事故當知菩薩摩訶薩所學般若波羅蜜中應有般若波羅蜜方便力若是福德離般若波羅蜜不得回向阿耨多羅三藐三菩提何以故般若波羅蜜中諸佛不可得諸善根不可得回向阿耨多羅三藐三菩提心亦不可得於是中菩薩摩訶薩行般若波羅蜜時應如是思惟諸過去佛及弟子身皆滅諸善根亦滅我今取相分別諸佛諸善根及諸心如是取相回向阿耨多羅三藐三菩提諸佛所不許何以故取相有所得故所謂於過去諸佛取相分別是故菩薩摩訶薩欲以諸善根回向阿耨多羅三藐三菩提不應有得不應取相如是回向若有得取相回向諸佛不説有大利益何以故是回向雜毒故譬如美食雜毒雖有好色好香為人所貪而雜毒愚癡之人食之歡喜貪其好色香美可口飯欲消時受若死若死等苦若善男子善女人不諦受不諦取相不諦誦讀不解中義如是教他言汝善男子過去未來現在十方諸佛從初發意已來至得阿耨多羅三藐三菩提入無餘涅槃乃至法盡於其中間行般若波羅蜜時作諸善根行禪波羅蜜毗梨耶波羅蜜羼提波羅蜜尸羅波羅蜜檀波羅蜜時作諸善根修四禪四無量心四無色定四念處乃至八聖道分佛十力乃至修十八不共法時作諸善根淨佛世界成就衆生作諸善根及諸佛戒衆定衆慧衆解脫衆解脫知見衆一切種智無錯謬法常捨行及諸弟子是中所種善根及諸佛所記當作辟支佛是中諸天龍阿修羅迦樓羅緊那羅摩睺羅伽等所種善根是諸福德稱量和合隨喜回向阿耨多羅三藐三菩提是回向以取相得法故如雜毒食得法者終無正回向何以故是得法雜毒有相有動有戲論若如是回向則為謗佛不隨佛教不隨法説是善男子善女人求佛道應如是學過去未來現在諸佛從初發意乃至法盡及弟子行般若波羅蜜時作善根乃至修一切種智如上説云何諸善根回向阿耨多羅三藐三菩提正回向有求佛道善男子善女人行般若波羅蜜不欲謗諸佛者諸福德應如是回向如諸佛所知無上智慧是諸善根相是諸善根性我亦如是隨喜如諸佛所知我亦如是回向阿耨多羅三藐三菩提求菩薩道善男子善女人應如是回向阿耨多羅三藐三菩提若如是回向則為不謗佛如佛所教如佛法説是菩薩摩訶薩回向則無雜毒論釋曰所起福德離五衆者先但説過去事今説自起隨喜福德若知是福德中無五衆十二入十八界雖行般若波羅蜜等諸法亦知空離相如是福德名正回向復次若菩薩知隨喜福德中隨喜福德性自離諸佛及善根并諸起阿耨多羅三藐三菩提心回向心菩薩般若波羅蜜等諸行法知自性空是名正回向隨喜福德者總説一切福德相善根隨喜起福德是別相説菩薩自緣所求阿耨多羅三藐三菩提是名阿耨多羅三藐三菩提心是菩薩隨喜心功德果但求無上道是名回向心行者五衆中假名字為菩薩般若波羅蜜等諸法如先義説先説福德中離五衆今説福德福德自相空復次菩薩念過去佛因緣生福德應如是回向如過去諸佛入無餘涅槃無相無戲論性常寂滅是福德及回向心亦如是如是回向是名正回向不墮顛倒復次若菩薩於諸過去佛功德取相分別回向是不名回向何以故有相是一邊無相是一邊離是二邊行中道是諸佛實相是故説諸過去佛不墮相數中不墮無相數中若如是取相數是不名回向則墮顛倒與上相違是為不墮顛倒是事難故彌勒重問所謂一切法不取相而復能回向須菩提是中不得決定答處是故語彌勒以是事故菩薩學般若波羅蜜求方便力是福德離般若波羅蜜不得回向者一切法中一法實而不誑所謂阿耨多羅三藐三菩提隨是阿耨多羅三藐三菩提行不誑道爾乃可得不誑道者即是般若波羅蜜是故説離般若波羅蜜是福德不可得回向何以故是般若波羅蜜畢竟空無有分別福德若離般若波羅蜜若不離般若波羅蜜不可得回向菩薩應作是念諸過去佛及弟子身并諸善根福德皆滅我今取相分別所謂是諸佛是弟子是善根是隨喜福德取相回向我為不是何以故與諸法實相異故受果報已久久當盡故不疾至佛道有所得故於過去諸佛憶想分別即是大失所謂過去佛空無而我憶想分別譬如雜毒食食是隨喜福德毒是取相故愛見等諸煩惱生好色者福德因緣作人王轉輪王天王得福樂好香者得好名譽富貴勢力凡夫無智之人所共貪愛愚癡人者是新發意取相著心菩薩食之歡喜者富樂福德因緣故於天人中受此富樂飯欲消時受若死若死等苦者是富樂若無常破壞離時憂愁遂死若次死受諸苦惱復次若死若死等者自失命根名死失所著物名死等復次若死若死等者苦惱多故失智慧命名死妨行善道名死等此經中須菩提自説是無智人不審諦受不取其義但著語言不諦取相者不如法分別不諦讀誦者忘失句逗若自失若受不具足不解義者不得經意如是少智師教化弟子汝善男子過去未來現在十方諸佛從初發意乃至如是回向則為謗佛不隨佛教不隨法説與此相違名為正回向復次正回向菩薩應作是念如十方三世諸佛所知用無上智慧知諸善根相一切智人中佛第一勝佛所知諸善根必是實相如佛所知我亦用如是善根相回向譬如射地無不著時若射餘物或著或不著如諸佛所知隨喜如射地無不著若用餘道隨喜如射餘物或著或不著如是回向是為不謗佛經復次求佛道善男子善女人行般若波羅蜜時諸善根應如是回向如色不繫欲界不繫色界不繫無色界不繫法者不名過去不名未來不名現在如受想行識不繫欲界不繫色界不繫無色界不繫法者不名過去未來現在十二入十八界亦如是如般若波羅蜜不繫欲界不繫色界不繫無色界不繫法者不名過去未來現在禪波羅蜜乃至檀波羅蜜亦如是內空乃至無法有法空亦如是如四念處不繫欲界不繫色界不繫無色界不繫法者不名過去未來現在乃至八聖道分亦如是佛十力乃至十八不共法亦如是如如法性法相法住法位實際不可思議性戒定慧解脫解脫知見衆一切種智無錯謬法常捨行不繫欲界不繫色界不繫無色界不繫法者不名過去未來現在是回向所回向處行者不繫皆亦如是如是諸佛亦不繫諸善根亦不繫是諸聲聞辟支佛善根亦不繫不繫法者不名過去未來現在若菩薩摩訶薩行般若波羅蜜時如是知色不繫三界不繫法者不名過去未來現在若法不過去未來現在者不可以取相有所得法回向阿耨多羅三藐三菩提何以故是色無生若法無生則無法無法中不可回向受想行識亦如是檀波羅蜜乃至般若波羅蜜四念處乃至無錯謬法常捨行不繫三界不繫法者亦非過去未來現在若非過去未來現在法者不可以取相有所得法回向阿耨多羅三藐三菩提何以故是法無生若法無生則無法無法中不可回向菩薩摩訶薩如是回向則無雜毒若求佛道善男子善女人以取相得法以諸善根回向阿耨多羅三藐三菩提是名邪回向若邪回向諸佛所不稱譽用是邪回向不能具足檀波羅蜜乃至般若波羅蜜不能具足四念處乃至八聖道分內空乃至無法有法空佛十力乃至無錯謬法常捨行不能具足淨佛世界成就衆生若不能淨佛世界成就衆生則不能得阿耨多羅三藐三菩提何以故是回向雜毒故復次菩薩摩訶薩行般若波羅蜜時應作是念如諸佛所知諸善根回向是真回向我亦應以是法相回向是名正回向爾時佛讚須菩提善哉善哉如汝所為為作佛事為諸菩薩摩訶薩説所應回向法以無相無得無出無垢無淨無法性自相空常性空法性如實際故須菩提若三千大千世界中衆生皆當得十善道四禪四無量心四無色定五神通於須菩提意云何是衆生得福多不甚多世尊佛言不如是善男子善女人於諸善根心不著回向阿耨多羅三藐三菩提最上第一最妙無上無與等復次須菩提若三千大千世界中衆生皆當作須陀洹乃至阿羅漢辟支佛若有善男子善女人盡形壽供養恭敬尊重讚歎衣服飲食臥具醫藥供給所須於須菩提意云何是善男子善女人是因緣故得福德多不甚多世尊佛言不如是善男子善女人於諸善根心不著回向阿耨多羅三藐三菩提最上第一最妙無上無與等復次須菩提若三千大千世界中衆生皆發阿耨多羅三藐三菩提心十方如恆河沙等世界中一一衆生如恆河沙等劫恭敬尊重讚歎供養是菩薩衣服飲食臥具醫藥供給所須於須菩提意云何是善男子善女人是因緣故得福多不甚多世尊無量無邊阿僧祇不可以譬喻為比世尊若是福德有形者十方如恆河沙等世界所不受佛告須菩提善哉善哉如汝所言雖爾不如善男子善女人於諸善根心不著回向阿耨多羅三藐三菩提最上第一最妙無上無與等是無著回向功德比前功德百倍千倍百千億倍乃至算數譬喻所不能及何以故是善男子善女人取相得法行十善道四禪四無量心四無色定五神通取相得法供養須陀洹恭敬尊重讚歎衣服飲食臥具醫藥供給所須乃至取相供養菩薩故爾時四天王天與二萬諸天子合掌禮佛作是言世尊菩薩摩訶薩最大回向以方便力故以無所得故以無相法故以無覺法故諸善根回向阿耨多羅三藐三菩提如是回向不墮二法爾時釋提桓因亦與無數三十三天及餘諸天子持天華瓔珞搗香澤香天衣幡蓋鼓天伎樂以供養佛作如是言世尊菩薩摩訶薩最大回向以方便力故以無所得故以無相法故以無覺法故諸善根回向阿耨多羅三藐三菩提如是回向不墮二法須夜摩天王與千天子刪兜率陀化樂他化自在諸天王各與千天子俱供養佛已作如是言世尊菩薩摩訶薩最大回向以方便力故以無所得故以無相法故以無覺法故諸善根回向阿耨多羅三藐三菩提如是回向不墮二法爾時諸梵天王與無數百千億那由他諸天俱詣佛所頭面禮佛足發大音聲作如是言未曾有也世尊菩薩摩訶薩為般若波羅蜜所護以方便力故勝前善男子善女人取相有所得者光音天乃至阿迦尼吒天與無數百千億那由他諸天俱詣佛所頭面禮佛足發大音聲作如是言未曾有也世尊菩薩摩訶薩為般若波羅蜜所護以方便力故勝前善男子善女人取相有所得者爾時佛告四天王天乃至阿迦尼吒諸天子若三千大千世界中所有衆生皆發阿耨多羅三藐三菩提心是一切菩薩念過去未來現在諸佛及聲聞辟支佛諸善根從初發意乃至法住於其中間所有善根并餘一切衆生所有善根所謂布施持戒忍辱精進一心智慧檀波羅蜜乃至般若波羅蜜戒衆定衆慧衆解脫衆解脫知見衆如是等諸餘無量佛法一切和合隨喜隨喜已回向阿耨多羅三藐三菩提以取相有所得故復有善男子善女人發阿耨多羅三藐三菩提心念過去未來現在諸佛及聲聞辟支佛從初發意乃至法住於其中間所有善根并餘一切衆生所有善根所謂布施持戒忍辱精進一心智慧檀波羅蜜乃至無量諸佛法一切和合稱量以無所得故無二法故無相法故不著法故無覺法故是最上隨喜第一最妙無上無與等隨喜隨喜已回向阿耨多羅三藐三菩提是善男子善女人功德勝前善男子善女人功德百倍千倍百千億倍乃至算數譬喻所不能及爾時須菩提白佛言世尊世尊説善男子善女人和合諸善根稱量隨喜回向最上第一最妙無上無與等世尊云何名隨喜最上乃至無與等佛言若善男子善女人念過去未來現在諸法不取不捨不念非不念不得非不得是諸法中亦無有法生者滅者若垢若淨諸法不增不減不來不去不合不散不入不出如過去未來現在諸法相如如相法性法住法位我亦如是隨喜隨喜已回向阿耨多羅三藐三菩提如是回向最上第一最妙無上無與等須菩提是隨喜法比餘隨喜百倍千倍百千億倍乃至算數譬喻所不能及復次須菩提求佛道善男子善女人於過去未來現在諸佛及聲聞辟支佛從初發心乃至法住於其中間所有善根若布施乃至智慧檀波羅蜜乃至無量諸佛法及餘一切衆生所有善根若欲隨喜者應如是隨喜作是念布施與解脫等戒忍精進禪智與解脫等色與解脫等受想行識亦與解脫等內空與解脫等乃至無法有法空亦與解脫等四念處與解脫等乃至八聖道分亦與解脫等佛十力與解脫等乃至一切種智亦與解脫等戒衆定衆慧衆解脫衆解脫知見衆亦與解脫等隨喜與解脫等過去未來現在諸法與解脫等十方諸佛與解脫等諸佛回向與解脫等諸佛與解脫等諸佛滅度與解脫等諸佛弟子聲聞辟支佛與解脫等諸佛弟子滅度與解脫等諸佛法相與解脫等諸聲聞辟支佛法相與解脫等一切諸法相亦與解脫等我以是諸善根相隨喜功德回向阿耨多羅三藐三菩提亦與解脫等不生不滅故須菩提是名諸菩薩摩訶薩隨喜功德最上第一最妙無上無與等須菩提菩薩成就是隨喜功德當疾得阿耨多羅三藐三菩提復次須菩提十方如恆河沙等諸佛及弟子現在若有求佛道善男子善女人盡形壽供養是諸佛及弟子一切所須供養恭敬尊重讚歎衣服飲食臥具醫藥是諸佛滅度後晝夜勤修供養恭敬尊重讚歎華香乃至幡蓋伎樂以取相有所得故持戒忍辱精進禪定修智慧以取相有所得故復有善男子善女人發意求阿耨多羅三藐三菩提行檀波羅蜜尸羅波羅蜜羼提波羅蜜毗梨耶波羅蜜禪波羅蜜般若波羅蜜時以不取相無所得法方便力諸善根回向阿耨多羅三藐三菩提是福德最上第一最妙無上無與等勝前福德百倍千倍百千億倍乃至算數譬喻所不及如是須菩提菩薩摩訶薩行檀波羅蜜時尸羅波羅蜜羼提波羅蜜毗梨耶波羅蜜禪波羅蜜般若波羅蜜時以方便力故諸善根應回向阿耨多羅三藐三菩提以不取相無所得法故論釋曰菩薩應作是念從色乃至常捨行諸法不繫三界故三世不攝諸佛及弟子并諸功德隨喜心回向處所用回向法回向者亦如是是名正回向爾時菩薩作是念若色出三界三世不攝不可以取相有所得回向何以故是色出三界者即是色實相初後生相不可得如破生品中説若法無生即是無所有無所有回向心云何回向無所有菩提心色受想行識乃至常捨行亦如是是名無雜毒回向所謂無相無得回向雜毒者所謂諸佛不讚歎不能具足六波羅蜜等乃至不能得阿耨多羅三藐三菩提復次菩薩應作是念如十方三世諸佛所知應如是生心如是念如是觀如是回向是功德直至無上道我亦如是隨喜回向是菩薩必得實隨喜回向不虛如先説因緣是略説諸回向品菩薩禮佛有三品一者悔過品二者隨喜回向品三者勸請諸佛品廣説則無量無邊善哉善哉汝作佛事者佛初發心誓度一切衆生須菩提雖是阿羅漢而能助佛説法開菩薩道是故讚言善哉善哉復次佛自説因緣為諸菩薩説所應回向法用無相故者以無相智慧和合回向福德相者與上相違名為無相無相有三種假名相法相無相相假名相者如車如屋如林如軍如衆生諸法和合中更有是名無明力故取是假名相起諸煩惱業法相者五衆十二入十八界等諸法肉眼觀故有以慧眼觀則無是故法亦虛誑妄語應捨離法相離是二相餘但有無相相有人取是無相相隨逐取相還生結使是故亦不應取無相相離三種相故名無相若無有相是中無所得無得故無出若法無得無出即是無垢無淨若法無垢無淨即是無法性若法無性即是自相空若法自相空即是法常自性空若法常自性空即同法性如實際用如是法和合隨喜福德回向故讚言善哉善哉復有善哉因緣所謂隨喜福德大利益衆生有大果報何者是大利益所謂佛語須菩提若三千大千世界衆生行十善乃至五通問曰欲界中二處天及梵天王何以與多天俱餘四天何以少答曰是二天依止地近佛故又五欲不如上天佛生時苦行時降魔時得道時轉法輪時常來供養佛是故多餘四處天宮殿在虛空中不屬地五欲妙染著深故不能多來又兜率天雖利根樂法而其天上常有補處菩薩説法是故不來梵天雖遠離欲故樂法情深佛為法王是故多來復次梵天王為色界主請佛初轉法輪是故應與多衆俱來餘色界天盡名梵天問曰先種種因緣説正回向正回向即是最上今何以更問答曰上處處廣説今略説所謂三世十方一切法決定心知於是法中無生者滅者等一切法不可得不可念不得不念故不取不捨入諸法實相中作是念如諸法實相我亦如是以隨喜福德回向不分別諸法不壞法性是名最上回向何以故果報常無盡故問曰六波羅蜜等諸法各各相若色相若無色相等解脫有二種有為解脫無為解脫云何皆與解脫等答曰我先已説凡夫人以肉眼六識顛倒觀故見異若以慧眼觀諸法皆虛妄唯涅槃為實是有為解脫屬無為隨無為故名解脫如實得道者名道人今未得道者衣服法則隨得道者故亦名道人如無餘涅槃不生不滅不入不出不垢不淨非有非無非常非無常常寂滅相心識觀滅語言道斷非法非非法等相用無所有相故慧眼觀一切法亦如是相是名六波羅蜜等與解脫等是故佛法中説解脫為貴上智慧貴解脫佛是中分別説若人無量阿僧祇劫行六波羅蜜用有所得法種種修集善根一人用無所得法但以心隨喜念他功德回向無上道是人百千萬分不及其一何以故先福德有量今福德無量先福德有盡今福德無盡先福德雜毒今福德無毒先福德隨生死今福德隨涅槃先福德不定或作佛或退今福德定到必疾作佛有如是等差別是故四種人若凡夫人求世間樂若聲聞辟支佛人求涅槃樂若諸菩薩摩訶薩求佛樂應如是隨喜生福德回向阿耨多羅三藐三菩提如此品中説
