  - {type: variant, offset: 4437, length: 109, content: '五眾從因緣和合生，無有定性，但有假名。「假名實相」者，所謂五眾如、法性、實際。須菩提所說，不違此理；何以故？聖人知名字是俗諦、實相是第一義諦；有所說者隨凡夫人，第一義諦中無彼此、亦無諍＝諦【聖】諍【大】，諦【聖】諍諦。乃至一切種智亦如是。

      眾生空乃至知者、見者空故，須陀洹但有假名，乃至佛亦如是＋（已上一百九字依舊藏本移入於此）夾註【明】是【大】，是已上一百九字依舊藏本移入於此【明】是是已上一百九字依舊藏本移入於此。', 元: ''}
