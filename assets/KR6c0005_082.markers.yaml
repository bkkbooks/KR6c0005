  - {type: variant, offset: 1627, length: 169, content: 須菩提白佛言：「世尊！佛〔以〕－【三】【聖】以【大】，〔－〕【宋】【元】【明】【聖】以何意故說般若波羅蜜最上、最妙？」佛告須菩提：「〔是〕－【三】是【大】，〔－〕【宋】【元】【明】是般若波羅蜜取一切善法到薩婆若中，住不住故。」須菩提白佛言：「世尊！般若波羅蜜有法可取、可捨不？」佛言：「不也！須菩提！般若波羅蜜無法可取、無法可捨。何以故？一切法不〔可〕－【三】【聖】＊可【大】＊，〔－〕【宋】【元】【明】【聖】＊可取、不可捨故。」「世尊！般若波羅蜜於何等法不取不捨？」佛言：「般若波羅蜜於色不取不捨，於受想行識乃至阿耨多羅三藐三菩提不取不捨。」「世尊！云何不取色，乃至不取阿耨多羅三藐三菩提？」, 宮: ''}
