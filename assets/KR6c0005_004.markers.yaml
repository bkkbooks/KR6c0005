  - {type: variant, offset: 1416, length: 26, content: '所以者〔何〕－【聖】何【大】，〔－〕【聖】何？一切諸法中，佛法（最）＋第【三】【聖】第【大】，最第【宋】【元】【明】【聖】第最第

