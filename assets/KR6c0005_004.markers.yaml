  - {type: variant, offset: 30, length: 348, content: 問曰：若從上數，應先菩薩，次第比丘、比丘尼、優婆塞、優婆夷，菩薩次佛故；若從下數，應先＋（從）【石】先【大】，先從【石】先先從優婆夷，次第優婆塞、比丘尼、比丘、菩薩。今何以先說比丘，次三眾，後說菩薩？答曰：菩薩雖應次佛，以諸煩惱未盡故，先說阿羅漢。諸阿羅漢智慧雖少而已成熟，諸菩薩智慧雖多而煩惱未盡，是故先說阿羅漢。佛法有二種：一、祕密，二、現＝顯【三】【宮】＊現【大】＊，顯【宋】【元】【明】【宮】＊現顯示。現顯示中，佛、辟支佛、阿羅漢皆是福田，以其煩惱盡無餘故。祕密中，說諸菩薩得無生法忍，煩惱已斷，具六神通，利益眾生。以現＝顯【三】【宮】【石】現【大】，顯【宋】【元】【明】【宮】【石】現顯示法故，前說阿羅漢，後說菩薩。復次，菩薩以方便力現入五道，受五欲，引導眾生；若在阿羅漢上，諸天、世人當生疑怪，是故後說。問曰：在阿羅漢後可爾，何以乃＝反【三】【宮】，乃＋（至）【石】乃【大】，反【宋】【元】【明】【宮】，乃至【石】乃反乃至在優婆塞、優婆夷後？答曰：四眾雖漏未盡，盡在不久故，通名聲聞眾。若於四眾中間＝聞【宮】間【大】，聞【宮】間聞說菩薩者，則不便。如比丘尼得無量律儀故，應次比丘後，在沙彌前；佛以儀法不便故，在沙彌後。此諸菩薩亦如是，雖應在學人三眾上，以不便故，在後說。復次，有人言：「菩薩功德、智慧超殊阿羅漢、辟支佛，是故別說。」, 聖: ''}
