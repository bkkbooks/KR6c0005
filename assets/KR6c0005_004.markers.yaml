  - {type: xml-element, offset: 769, content: '', id: pT25p0085b1201, name: p, role: open, attrs: {'xml:id': pT25p0085b1201, style: 'margin-left:1em'}}
  - {type: variant, offset: 769, length: 159, content: 如阿羅漢一切名字尚斷，何況菩薩能破一切諸法、知實相、得法身而不斷耶！以是故，摩訶衍四眾中別說菩薩。問曰：何以故大乘經初，菩薩眾、聲聞眾兩說，聲聞經〔初〕－【元】【明】初【大】，〔－〕【元】【明】初獨說比丘眾，不說菩薩眾？答曰：欲辯＝辨【元】【宮】辯【大】，辨【元】【宮】辯辨二乘義故：佛乘及聲聞乘。聲聞乘陿小，佛乘廣大；聲聞乘自利自為，佛乘益一切。復次，聲聞乘＋（中）【石】乘【大】，乘中【石】乘乘中多說眾生空，佛乘說眾生空、法空。如是等種種分別＋（三乘分別）【三】【宮】，（二乘分別）【石】別【大】，別三乘分別【宋】【元】【明】【宮】，別二乘分別【石】別別三乘分別別二乘分別說〔是〕－【石】是【大】，〔－〕【石】是二道故，摩訶衍經聲聞眾、菩薩眾兩說。如〔讚〕－【石】讚【大】，〔－〕【石】讚摩訶衍＋（讚）【石】衍【大】，衍讚【石】衍衍讚偈中說：, 聖: 如阿羅漢一切名字尚悉斷何況諸菩薩能知一切諸法實相得法身能而不斷是故此中別說菩薩問曰若從上數應先菩薩次比丘比丘尼優婆塞優婆夷菩薩次佛故若從下數應先優婆夷優婆塞比丘尼比丘菩薩今何以故先說聲聞四眾後說菩薩答曰菩薩雖應次佛以諸煩惱未盡故先說阿羅漢諸阿羅漢智慧雖少而已成熟諸菩薩智慧雖多而煩惱未盡是故先說阿羅漢佛法有二種一祕密二顯示顯示中佛辟支佛阿羅漢皆是福田以其煩惱滅盡無餘故祕密中說諸菩薩得無生法忍煩惱已斷具六神通利益眾生以顯示法故前說阿羅漢後說菩薩復次菩薩以方便力現入五道受五欲引導眾生若在阿羅漢上諸天世人當生疑悋是故後說問曰在阿羅漢後可爾何以乃在優婆塞優婆夷後答曰四眾雖漏未盡盡在不久故通名聲聞眾若於四眾中聞說菩薩者則不便如比丘尼得無量律儀故應次比丘後在沙彌前佛以宜法不便故在沙彌後此諸菩薩亦如是雖應在學人三眾上以不便故在後說復次有人言菩薩功德智慧超殊阿羅漢辟支佛是故別說問曰何以故大乘經初菩薩聲聞眾別說聲聞經初獨說比丘眾不說菩薩眾答曰欲辨二乘義故佛乘及聲聞乘聲聞乘夾小佛乘廣大聲聞乘自利自為佛乘益一切復次聲聞乘中多說眾生空佛乘中多說眾生空法空如是等種種分別二乘是二道分別說故摩訶衍經中聲聞菩薩眾合說如讚摩訶衍讚偈中說}
