  - {type: variant, offset: 3804, length: 30, content: '若能知彼非，是為知正見＝法【聖】【石】見【大】，法【聖】【石】見法。

      不肯受他法，是名愚癡人，

      作是論議＝諸有戲論【聖】【石】作是論議【大】，諸有戲論【聖】【石】作是論議諸有戲論者，真是愚癡＝皆是大愚【聖】【石】真是愚癡【大】，皆是大愚【聖】【石】真是愚癡皆是大愚人。', 宋: 知此為知實，不知為謗法，不受他法故，是則無智人，諸有戲論者，悉皆是無智, 元: 知此為知實，不知為謗法，不受他法故，是則無智人，諸有戲論者，悉皆是無智, 明: 知此為知實，不知為謗法，不受他法故，是則無智人，諸有戲論者，悉皆是無智, 宮: 知此為知實，不知為謗法，不受他法故，是則無智人，諸有戲論者，悉皆是無智}
