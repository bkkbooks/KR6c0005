  - {type: variant, offset: 3221, length: 166, content: 問曰：眼識亦與三眾作因，何以但說「觸」？答曰：眼識少時住，見色便滅；次生意識，能分別色好醜。是故不說眼識。因眼、色、識三事和合故生觸，觸生心數法。眼識因緣遠故不說。問曰：一切識皆有觸，何以但「觸因緣生心數法」？答曰：心有二種：一者、念念生滅心，二者、次第相續心。觸亦如是，次第相續觸麁故，說因觸生心數法；念念觸微細，亦共生心數法，不了故不說。若情、塵、識三事和合能受苦樂，爾時觸法了了，以是故說因觸生心數法。, 宋: 問曰眼識中亦有觸及三眾何以故言觸法因緣生三眾答曰此論現在因緣觸生三眾非眼見因緣問曰因心心數法生三眾何以但言觸答曰眼識少許時住便滅生意識細微不了故不說生三眾但說從觸生, 宮: 問曰眼識中亦有觸及三眾何以故言觸法因緣生三眾答曰此論現在因緣觸生三眾非眼見因緣問曰因心心數法生三眾何以但言觸答曰眼識少許時住便滅生意識細微不了故不說生三眾但說從觸生, 石: 因外色緣念欲見有明有空色在可見處如是等因緣生眼識是上因緣及識和合故從識中生心數法名為觸是觸為一切心數法根本三眾俱生所謂受想行問曰眼識中亦有觸及三眾何以故言觸法因緣生三眾答曰此論現在因緣觸生三眾非眼見因緣問曰因心心數法生三眾何以但言觸答曰眼識少許時住便滅生意識細微不了故不說生三眾但說從觸生, 元: 問曰眼識中亦有觸及三眾何以故言觸法因緣生三眾答曰此論現在因緣觸生三眾非眼見因緣問曰因心心數法生三眾何以但觸答曰眼識少許時住便滅生意識細微不了故不說生三眾但說從觸生, 明: 問曰眼識中亦有觸及三眾何以故言觸法因緣生三眾答曰此論現在因緣觸生三眾非眼見因緣問曰因心心數法生三眾何以但觸答曰眼識少許時住便滅生意識細微不了故不說生三眾但說從觸生}
