  - {type: punctuation, offset: 3191, content: ，, id: KR6c0005_T_036-bkkpn754}
  - {type: variant, offset: 3191, length: 30, content: 如經說：「因眼緣色生眼識，三事和合故生觸，是觸即時三眾共生，所謂受、想、行。」, 宋: 內眼因外色緣念欲見有明有空色在可見處如是等因緣生眼識是上因緣及識和合故從識中生心數法名為觸是觸為一切心數法根本三眾俱生所謂受想行, 元: 內眼因外色緣念欲見有明有空色在可見處如是等因緣生眼識是上因緣及識和合故從識中生心數法名為觸是觸為一切心數法根本三眾俱生所謂受想行, 明: 內眼因外色緣念欲見有明有空色在可見處如是等因緣生眼識是上因緣及識和合故從識中生心數法名為觸是觸為一切心數法根本三眾俱生所謂受想行, 宮: 內眼因外色緣念欲見有明有空色在可見處如是等因緣生眼識是上因緣及識和合故從識中生心數法名為觸是觸為一切心數法根本三眾俱生所謂受想行, 石: 因外色緣念欲見有明有空色在可見處如是等因緣生眼識是上因緣及識和合故從識中生心數法名為觸是觸為一切心數法根本三眾俱生所謂受想行}
