front:
  text: 摩訶般若波羅蜜經釋論序長安釋僧叡述夫萬有本於生生而生生者無生變化兆於物始而始始者無始然則無生無始物之性也生始不動於性而萬有陳於外悔吝生於內者其唯邪思乎正覺有以見邪思之自起故阿含為之作知滯有之由惑故般若為之照然而照本希夷津涯浩汗理超文表趣絕思境以言求之則乖其深以智測之則失其旨二乘所以顛沛於三藏雜學所以曝鱗於龍門者不其然乎是以馬鳴起於正法之餘龍樹生於像法之末正餘易弘故直振其遺風瑩拂而已像末多端故乃寄跡凡夫示悟物以漸又假照龍宮以朗搜玄之慧託聞幽祕以窮微言之妙爾乃憲章智典作茲釋論其開夷路也則令大乘之駕方軌而直入其辯實相也則使妄見之惑不遠而自復其為論也初辭擬之必標眾異以盡美卒成之終則舉無執以盡善釋所不盡則立論以明之論其未辯則寄折中以定之使靈篇無難喻之章千載悟作者之旨信若人之功矣有鳩摩羅耆婆法師者少播聰慧之聞長集奇拔之譽才舉則亢標萬里言發則英辯榮枯常杖茲論為淵鏡憑高致以明宗以秦弘始三年歲次星紀十二月二十日自姑臧至長安秦王虛襟既已蘊在昔見之心豈徒則悅而已晤言相對則淹留終日研微造盡則窮年忘倦又以晤言之功雖深而恨獨符之心不曠造盡之要雖玄而惜津梁之勢未普遂以莫逆之懷相與弘兼忘之慧乃集京師義業沙門命公卿賞契之士五百餘人集於渭濱逍遙園堂鑾輿佇駕於洪涘禁禦息警於林間躬覽玄章考正名於梵本諮通津要坦夷路於來踐經本既定乃出此釋論論之略本有十萬偈偈有三十二字并三百二十萬言梵夏既乖又有煩簡之異三分除二得此百卷於大智三十萬言玄章婉旨朗然可見歸途直達無復惑趣之疑以文求之無間然矣故天竺傳云像正之末微馬鳴龍樹道學之門其淪胥溺喪矣其故何耶寔由二未𢍆微邪法用盛虛言與實教並興嶮徑與夷路爭轍始進者化之而流離向道者惑之而播越非二匠其孰與正之是以天竺諸國為之立廟宗之若佛又稱而詠之曰智慧日已頹斯人令再曜世昏寢已久斯人悟令覺若然者真可謂功格十地道侔補處者矣傳而稱之不亦宜乎幸哉此中鄙之外忽得全有此論梵文委曲皆如初品法師以秦人好簡故裁而略之若備譯其文將近千有餘卷法師於秦語大格唯譯一往方言殊好猶隔而未通苟言不相喻則情無由比不比之情則不可以託悟懷於文表不喻之言亦何得委殊塗於一致理固然矣進欲停筆爭是則交競終日卒無所成退欲簡而便之則負傷於穿鑿之譏以二三唯案譯而書都不備飾幸冀明悟之賢略其文而挹其玄也
